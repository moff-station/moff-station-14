- type: entity
  parent: CrateSecgear
  id: CrateSecurityArmor
  name: armor crate
  description: Contains three standard-issue helmets and three bulletproof vests. Requires Security access to open.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: ClothingHeadHelmetBasic
          amount: 3
        - id: ClothingOuterArmorBulletproof
          amount: 3

- type: entity
  parent: CrateSecgear
  id: CrateSecurityNonlethal
  # Moff start - no stuns
  name: less-lethals crate
  description: Contains a mix of nightsticks, flashes, shell guns, and beanbag shells. Requires Security access to open.
  # Moff end
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
