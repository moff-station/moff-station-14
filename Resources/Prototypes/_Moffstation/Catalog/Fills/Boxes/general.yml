- type: entity
  name: costume box
  parent: BoxCardboard
  id: BoxCostume
  components:
  - type: Sprite
    layers:
    - state: boxwide
  - type: Item
    shape:
    - 0,0,3,3
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,3,3

- type: entity
  name: ice fairy costume box
  parent: BoxCostume
  id: BoxIceFairy
  description: Contains the personal belongings of a certain ice fairy. Happy Cirno Day!
