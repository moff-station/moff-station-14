- type: entity
  parent: BoxCardboard
  id: BoxSurvivalEmpty
  name: survival box
  description: A cardboard box for storing emergency supplies.
  components:
  - type: Item
    size: Normal
    shape:
    - 0,0,1,1
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,2,2
    whitelist:
      tags:
      - SurvivalBoxInsertable

- type: entity
  name: red performer costume bag
  parent: ClothingBackpackDuffel
  id: BoxPerformerRed
  description: Great for impersonating virtual chimera performers.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: ClothingShoesBootsPerformerRed
        - id: ClothingUniformJumpskirtPerformerRed
        - id: ClothingHeadPerformerWigRed
        - id: FoodBreadBaguette

