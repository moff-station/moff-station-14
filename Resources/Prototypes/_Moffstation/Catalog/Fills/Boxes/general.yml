- type: entity
  parent: BoxCardboard
  id: BoxSurvivalEmpty
  name: survival box
  description: A cardboard box for storing emergency supplies.
  components:
  - type: Item
    size: Normal
    shape:
    - 0,0,1,1
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,2,2
    whitelist:
      tags:
      - SurvivalBoxInsertable

- type: entity
  parent: BoxSurvivalEmpty
  id: BoxHugEmpty
  name: box of hugs
  description: A special box for sensitive people.
  suffix: Empty
  components:
  - type: Sprite
    layers:
    - state: box_hug
    - state: heart
  - type: Item
    heldPrefix: hug
  - type: Tag
    tags:
    - BoxCardboard
    - BoxHug

- type: entity
  name: red performer costume bag
  parent: ClothingBackpackDuffel
  id: BoxPerformerRed
  description: Great for impersonating virtual chimera performers.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: ClothingShoesBootsPerformerRed
        - id: ClothingUniformJumpskirtPerformerRed
        - id: ClothingHeadPerformerWigRed
        - id: FoodBreadBaguette

- type: entity
  name: yellow performer costume bag
  parent: ClothingBackpackDuffel
  id: BoxPerformerYellow
  description: Great for impersonating... the yellow one?
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: ClothingShoesBootsPerformerYellow
        - id: ClothingUniformJumpskirtPerformerYellow
        - id: ClothingHeadPerformerWigYellow

- type: entity
  name: ice fairy costume box
  parent: BoxCardboard
  id: BoxIceFairy
  description: Contains the personal belongings of a certain ice fairy. Happy Cirno Day!
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: ClothingUniformJumpskirtIceFairy
        - id: ClothingHeadIceFairyWig
        - id: ClothingNeckIceFairyWings
  - type: Sprite
    layers:
    - state: cirno
  - type: Item
    shape:
    - 0,0,3,1
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,3,1
