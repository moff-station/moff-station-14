- type: entity
  parent: BasePlant
  id: CoffeePlants
  name: coffee
  components:
  - type: Sprite
    sprite: _Moffstation/Objects/Specific/Hydroponics/coffee_plant.rsi
  - type: PlantData
    name: seeds-coffee-name
    packetPrototype: CoffeeSeeds
    productPrototypes: [ FoodCoffeeCherries ]
    mutationPrototypes: [ MugTreePlants ]
  - type: Plant
    growthStages: 5
    lifespan: 55
    maturation: 6
    production: 6
    yield: 3
    potency: 20
  - type: PlantHarvest
    harvestRepeat: Repeat
  - type: PlantChemicals
    chemicals:
      Nutriment:
        min: 1
        max: 10
        potencyDivisor: 10

- type: entity
