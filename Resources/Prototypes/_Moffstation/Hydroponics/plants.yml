    name: seeds-mugtree-name
    packetPrototype: MugTreeSeeds
    productPrototypes: [ FoodMugFruit ]
  - type: Plant
    growthStages: 5
    lifespan: 55
    maturation: 6
    production: 6
    yield: 4
    potency: 20
  - type: PlantHarvest
    harvestRepeat: Repeat
  - type: PlantChemicals
    chemicals:
      Coffee:
        min: 10
        max: 30
        potencyDivisor: 4
