- type: polymorph
  abstract: true
  id: WizardForcedFishBase
  configuration:
    entity: MobCarpMagic
    forced: true
    inventory: None
    transferName: false
    transferDamage: true
    revertOnCrit: false
    revertOnDeath: true
    polymorphSound: !type:SoundPathSpecifier
      path: /Audio/Magic/forcewall.ogg
    exitPolymorphSound: !type:SoundPathSpecifier
      path: /Audio/Magic/forcewall.ogg

- type: polymorph
  parents: WizardForcedFishBase
  id: WizardForcedCarp

- type: polymorph
  parents: WizardForcedFishBase
  id: WizardForcedDragon
  configuration:
    entity: MobDragonMagic

- type: polymorph
  parents: WizardForcedFishBase
  id: WizardForcedShark
  configuration:
    entity: MobSharkMagic
