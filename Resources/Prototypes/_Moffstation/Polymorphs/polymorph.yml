- type: polymorph
  abstract: true
  id: MoffWizardForcedFishBase
  configuration:
    entity: MobCarpMagic
    forced: true
    inventory: None
    transferName: false # No vibechecking the ID of the fish
    transferDamage: true
    revertOnCrit: false
    revertOnDeath: true
    polymorphSound: !type:SoundPathSpecifier
      path: /Audio/Magic/forcewall.ogg
    exitPolymorphSound: !type:SoundPathSpecifier
      path: /Audio/Magic/forcewall.ogg

- type: polymorph
  parent: MoffWizardForcedFishBase
  id: MoffWizardForcedCarp

- type: polymorph
  parent: MoffWizardForcedFishBase
  id: MoffWizardForcedDragon
  configuration:
    entity: MoffMobDragonMagic

- type: polymorph
  parent: MoffWizardForcedFishBase
  id: MoffWizardForcedShark
  configuration:
    entity: MoffMobSharkMagic

- type: polymorph
  id: WraithJaunt
  configuration:
    entity: WraithJaunt
    transferName: true
    inventory: None
    forced: true
    revertOnDeath: true
    revertOnCrit: true
    allowRepeatedMorphs: false
    polymorphSound: /Audio/Magic/ethereal_enter.ogg
    exitPolymorphSound: /Audio/Magic/ethereal_exit.ogg
    duration: 3
