# Derelict service cyborg spawn
- type: entity
  parent: BaseDerelictCyborgSpawn
  id: DerelictServiceCyborgSpawn
  components:
  - type: AntagSpawner
    prototype: PlayerServiceBorgDerelictGhostRole
  - type: AntagSelection
    antags:
    - !type:FixedAntagCount
      proto: DerelictServiceCyborg

- type: antagSpecifier
  parent: DerelictCyborg
  id: DerelictServiceCyborg
  spawnerPrototype: SpawnPointGhostDerelictServiceCyborg

- type: entity
  parent: BaseAntagGhostRoleRule
  id: RevenantSpawn
  components:
  - type: StationEvent
    weight: 7.5
    duration: null
    occursDuringRoundEnd: false
    earliestStart: 45
    minimumPlayers: 20
  - type: AntagRandomSpawn
  - type: AntagSpawner
    prototype: MobRevenant
  - type: AntagSelection
    antags:
    - !type:FixedAntagCount
      proto: Revenant
  - type: ESSynchronizedVoteManager
    votes:
    - RevenantEnroller
  - type: DynamicRuleCost
    cost: 25

- type: antagSpecifier
  parent: RestrictedAntag
  id: Revenant
  spawnerPrototype: SpawnPointGhostRevenant
  pickPlayer: false
  allowNonHumans: true
  mindRoles:
  - MindRoleGhostRoleSoloAntagonist

