# Namespaced from roundstart.yml - the scheduler pool, now built from our four categories
- type: entityTable
  id: BasicGameRulesTable
  table: !type:AllSelector # we need to pass a list of rules, since rules have further restrictions to consider via StationEventComp
    children:
      - !type:NestedSelector
        tableId: MoffCalmEventsTable
      - !type:NestedSelector
        tableId: MoffSpicyEventsTable

# Namespaced from roundstart.yml - the scheduler pool, now built from our four categories
- type: entityTable
  id: DynamicGameRulesTable
  table: !type:AllSelector # we need to pass a list of rules, since rules have further restrictions to consider via StationEventComp
    children:
      - !type:NestedSelector
        tableId: MoffCalmEventsTable
      - !type:NestedSelector
        tableId: MoffSpicyEventsTable

# Everything the calm scheduler can run - events which generally can't kill you
- type: entityTable
  id: MoffCalmEventsTable
  table: !type:AllSelector
    children:
      - !type:NestedSelector
        tableId: MoffCalmPlayerEventsTable
      - !type:NestedSelector
        tableId: MoffCalmNonPlayerEventsTable

- type: entityTable
  id: MoffSpicyEventsTable
  table: !type:AllSelector
    children:
      - !type:NestedSelector
        tableId: MoffSpicyPlayerEventsTable
      - !type:NestedSelector
        tableId: MoffSpicyNonPlayerEventsTable

# Passive/Neutral Player-Controlled events
- type: entityTable
  id: MoffCalmPlayerEventsTable
  table: !type:AllSelector
    children:
      - id: RandomSentience
      - id: DerelictEngineerCyborgSpawn
      - id: DerelictGenericCyborgSpawn
      - id: DerelictJanitorCyborgSpawn
      - id: DerelictMedicalCyborgSpawn
      - id: DerelictMiningCyborgSpawn
      - id: DerelictServiceCyborgSpawn
      - id: TouristSpawn
      - id: UnknownShuttleSyndieEvacPod
      - id: UnknownShuttleManOWar
        prob: 0.05

# Hostile Player-Controlled events
- type: entityTable
  id: MoffSpicyPlayerEventsTable
  table: !type:AllSelector
    children:
      - id: ClosetSkeleton
      - id: RevenantSpawn
      - id: SyndieVentSoldierSpawn
      - id: DerelictSyndicateAssaultCyborgSpawn
      - id: RatKingSpawn
      - id: DragonSpawn
      - id: NinjaSpawn
      - id: ParadoxCloneSpawn
      - id: SleeperAgents
      - id: ZombieOutbreak
      - id: LoneOpsSpawn
      - id: SyndicateListeningOutpostSpawn
      - id: PirateCorsairSpawn
      - id: ReplicatorSpawn
      - id: EeepSpawn
      - id: UnknownShuttleInstigator
        prob: 0.05

# Good/Neutral NPC events
- type: entityTable
  id: MoffCalmNonPlayerEventsTable
  table: !type:AllSelector
    children:
      - id: BureaucraticError
      - id: ClericalError
      - id: BluespaceLocker
      - !type:NestedSelector
        tableId: CargoGiftsTable
      - !type:NestedSelector
        tableId: CalmCargoPackingErrorTable
      - !type:NestedSelector
        tableId: CalmPestEventsTable
      - !type:NestedSelector
        tableId: WreckEventTable
        prob: 0.05

# Hostile NPC events
- type: entityTable
  id: MoffSpicyNonPlayerEventsTable
  table: !type:AllSelector
    children:
      - id: AnomalySpawn
      - id: BluespaceArtifact
      - id: BreakerFlip
      - id: PowerGridCheck
      - id: SolarFlare
      - id: GasLeak
      - id: KudzuGrowth
      - id: VentClog
      - id: GreytideVirus
      - id: IonStorm
      - id: MassHallucinations
      - id: LightOverloadRule
      - id: LightOverloadRuleBlinking
      - id: SyndicateDeadDrop
      - id: LawBreakerVirus
      - id: HellPortalSpawn
      - !type:NestedSelector
        tableId: SpicyCargoPackingErrorTable
      - !type:NestedSelector
        tableId: SpicyPestEventsTable

- type: entityTable
  id: SpicyPestEventsTable
  table: !type:AllSelector
    children:
    - id: SnailMigration
    - id: SlimesSpawnHorde
    - id: SnakeSpawnHorde
    - id: SpiderClownSpawnHorde
    - id: SpiderSpawnHorde
    - id: CarpSpawnHorde
    - id: GorillaSpawnHorde
    - id: SyndyCatSpawnHorde
    - id: FleshSpawnHorde
    - id: ArgocyteSpawnHorde
    - id: HivebotSpawnHorde
    - id: BatSpawnHorde
    - id: SpaceCreatureSpawnHorde
    - id: XenoSpawnHorde
