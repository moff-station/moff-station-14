# Moffstation - Enroll votes spawned by an antag rule's ESSynchronizedVoteManager. When the timer runs out,
# MoffEnrollEventSystem starts the owning rule and turns the enrolled players into its antags.


- type: entity
  id: MoffBaseEntry
  abstract: true
  components:
  - type: MoffVoteEntry

- type: entity
  parent: MoffBaseEntry
  id: MoffBaseEnroll
  abstract: true
  components:
  - type: MoffEnrollEvent

- type: entity
  parent: MoffBaseEntry
  id: MoffBaseEnrollCalm
  abstract: true
  components:
  - type: MoffEnrollEvent
    fallbackRules: !type:NestedSelector
      tableId: MoffCalmNonPlayerEventsTable

- type: entity
  parent: MoffBaseEntry
  id: MoffBaseEnrollNoFallback
  abstract: true
  components:
  - type: MoffEnrollEvent
    fallbackRules: null

# Split into spicy and calm, so that it reflects our tables

# Spicy

- type: entity
  parent: MoffBaseEnroll
  id: DragonEnroller
  name: Space Dragon
  description: Call in 3 carp rifts and take over this quadrant! You have only 5 minutes in between each rift before you will disappear.

- type: entity
  parent: MoffBaseEnroll
  id: NinjaEnroller
  name: Space Ninja
  description: Play as an elite mercenary of the mighty Spider Clan! Surprise is your weapon. Shadows are your armor. Without them, you are nothing. Use your pinpointer to find the station.

- type: entity
  parent: MoffBaseEnroll
  id: ParadoxCloneEnroller
  name: Paradox Clone
  description: A freak space-time anomaly has teleported you into another reality! Now you have to find your counterpart to kill and replace them, or find a way to coexist.

- type: entity
  parent: MoffBaseEnroll
  id: SyndieVentSoldierEnroller
  name: Syndicate Vent Soldier
  description: You, the first person the syndicate could find, have been sent on a mission to the station.

- type: entity
  parent: MoffBaseEnroll
  id: LoneOpEnroller
  name: Lone Operative
  description: Find the nuke disk and blow up the station.

- type: entity
  parent: MoffBaseEnroll
  id: PirateCorsairEnroller
  name: Pirate Corsair
  description: SHIVER ME TIMBERS! YOU BE A PIRATE SENT TO ROB THE STATION. STEAL, LOOT, PILLAGE, AND MAKE US ALL RICH.

- type: entity
  parent: MoffBaseEnroll
  id: SyndicateSpyEnroller
  name: Syndicate Spy
  description: Observe the station from afar and coordinate Syndicate efforts from the safety of your listening post.
  components:
  - type: MoffEnrollEvent
    minEnrolled: 2

- type: entity
  parent: MoffBaseEnroll
  id: WizardEnroller
  name: Wizard
  description: YER A WIZARD! Prove you're the best the space wizard federation has to offer!

- type: entity
  parent: MoffBaseEnroll
  id: ReplicatorEnroller
  name: Replicator Queen
  description: A pattern coalesces. The Pattern that must repeat. Consume. Repeat.

- type: entity
  parent: MoffBaseEnroll
  id: EepEnroller
  name: Eeplet
  description: A bad tempered and fully grown Electric sheep.

- type: entity
  parent: MoffBaseEnroll
  id: ClosetSkeletonEnroller
  name: Closet Skeleton
  description: You are arguably one of the oldest members of the station! Get your old job back, or cause chaos! The world is yours to shape.

- type: entity
  parent: MoffBaseEnroll
  id: RevenantEnroller
  name: Revenant
  description: You are a Revenant. Use your powers to harvest souls and unleash chaos upon the crew. Unlock new abilities with the essence you harvest.

- type: entity
  parent: MoffBaseEnroll
  id: RatKingEnroller
  name: Rat King
  description: You are the Rat King, your interests are food, food, and more food. Fight against the station for food. Did I say food interests you?

- type: entity
  parent: MoffBaseEnroll
  id: InstigatorEnroller
  name: Cybersun Assault Ship
  description: You are a soldier from Cybersun sent on an assault ship to a Nanotrasen station.
  components:
  - type: MoffEnrollEvent
    minEnrolled: 3

# Calm
- type: entity
  parent: MoffBaseEnroll
  id: TouristEnroller
  name: Tourists
  description: Have careless fun on your vacation to a Nanotrasen station!
  components:
  - type: MoffEnrollEvent
    minEnrolled: 2
    fallbackRules: !type:NestedSelector
      tableId: MoffCalmNonPlayerEventsTable

- type: entity
  parent: MoffBaseEnroll
  id: SyndieVisitorEnroller
  name: Syndicate Disaster Victim
  description: You're a regular passenger from a syndicate station. Unfortunately, your evacuation pod has thrown you into an enemy sector...
  components:
  - type: MoffEnrollEvent
    minEnrolled: 2
    fallbackRules: !type:NestedSelector
      tableId: MoffCalmNonPlayerEventsTable

- type: entity
  parent: MoffBaseEnroll
  id: CossackEnroller
  name: Ancient Traveler
  description: From a history lost to time, you find yourself cast into this day and age.
  components:
  - type: MoffEnrollEvent
    minEnrolled: 2
    fallbackRules: !type:NestedSelector
      tableId: MoffCalmNonPlayerEventsTable

- type: entity
  parent: MoffBaseEnroll
  id: DerelictCyborgEnroller
  name: Derelict Cyborg
  description: You are a cyborg that got lost in space. After years of exposure to ion storms you find yourself near a space station.

# Emergency Response Teams

- type: entity
  parent: MoffBaseEnrollNoFallback
  id: ERTGeneralEnroller
  name: Emergency Response Team
  description: You are part of a team of emergency specialists sent by Nanotrasen to solve the mess the station has gotten itself into.
  components:
  - type: MoffEnrollEvent
    minEnrolled: 3
    fallbackRules: null

- type: entity
  parent: MoffBaseEnrollNoFallback
  id: ERTDeathSquadEnroller
  name: Death Squad
  description: A member of a Nanotrasen deathsquad being deployed to the station. Leave no one alive.
  components:
  - type: MoffEnrollEvent
    minEnrolled: 3
    fallbackRules: null

