# Roles
# Mirrors the randomHumanoidSettings the ghost role spawners used, so an enrolled responder gets the same
# gear, implants and callsign the ghost role would have handed out.

- type: antagSpecifier
  abstract: true
  parent: RestrictedAntag
  id: BaseERTAntag
  pickPlayer: false
  roleLoadout:
  - RoleSurvivalMilitaryDouble
  components:
  - type: AntagImmune
  - type: AutoImplant
    implants:
    - MindShieldImplant
    - DeathRattleImplantCentcomm
  mindRoles:
  - MindRoleERT

- type: antagSpecifier
  parent: BaseERTAntag
  id: ERTLeaderEVA
  startingGear: ERTLeaderGearEVA
  components:
  - type: RandomMetadata
    nameSegments:
    - NamesMilitaryLast
    nameFormat: name-format-ert-leader

- type: antagSpecifier
  parent: BaseERTAntag
  id: ERTLeaderArmed
  startingGear: ERTLeaderGearArmed
  components:
