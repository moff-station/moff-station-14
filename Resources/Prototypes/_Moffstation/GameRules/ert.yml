- type: entity
  parent: BaseGameRule
  id: ERTGeneral
  components:
  - type: StationEvent
    startAnnouncement: ert-sec
    startAudio:
      path: /Audio/Misc/notice1.ogg
  - type: LoadMapRule
    gridPath: /Maps/_Moffstation/PreCrewed/dart.yml
  - type: RuleGrids
  - type: AntagLoadProfileRule
  - type: AntagSelection
    selectionTime: Enroll
    antags:
    - !type:FixedAntagCount
      proto: ERTLeaderEVA
    - !type:FixedAntagCount
      proto: ERTSecurityEVA
    - !type:FixedAntagCount
      proto: ERTMedicalEVA
      count: 2
    - !type:FixedAntagCount
      proto: ERTEngineerEVA
      count: 2
    - !type:FixedAntagCount
      proto: ERTJanitorEVA
    - !type:FixedAntagCount
      proto: ERTChaplainEVA
  - type: ESSynchronizedVoteManager
    votes:
    - ERTGeneralEnroller

