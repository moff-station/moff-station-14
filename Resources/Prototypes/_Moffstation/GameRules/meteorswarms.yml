- type: entity
  parent: MeteorSwarm
  id: MissileBarrage
  components:
  - type: StationEvent
    weight: 4
    earliestStart: 30
  - type: MeteorSwarm
    announcement: station-event-rocket-barrage-start-announcement
    announcementSound: /Audio/Announcements/war.ogg
    meteorVelocity: 30
    meteors:
      MoffBulletMissile: 1
    waves:
      min: 2
      max: 4
    meteorsPerWave:
      min: 5
      max: 15

- type: entity
  id: ImmovableRodSpawn
  parent: BaseGameRule
  components:
  - type: StationEvent
    startAnnouncement: station-event-immovable-rod-start-announcement
    startAudio:
      path: /Audio/Announcements/attention.ogg
    weight: 3.5
    reoccurrenceDelay: 1
    duration: 1
    earliestStart: 30
    minimumPlayers: 25
  - type: ImmovableRodRule
    rodPrototypes: !type:GroupSelector
      children:
      - id: ImmovableRodKeepTilesStill
        weight: 81
      - id: ImmovableRodMop
        weight: 1
      - id: ImmovableRodShark
        weight: 1
      - id: ImmovableRodClown
        weight: 1
      - id: ImmovableRodBanana
        weight: 1
      - id: ImmovableRodHammer
        weight: 1
      - id: ImmovableRodThrongler
        weight: 1
      - id: ImmovableRodGibstick
        weight: 1
      - id: ImmovableRodWeh
        weight: 1
      - id: ImmovableRodSlowKeepTiles
        weight: 5
      - id: ImmovableRodSentient
        weight: 5
      - id: ImmovableRodDespawn
        weight: 1
