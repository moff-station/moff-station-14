- type: entity
  parent: CrateGeneric
  id: CrateWood
  name: wooden crate
  components:
  - type: Icon
    sprite: _Moffstation/Structures/Storage/Crates/woodcrate.rsi
  - type: Sprite
    sprite: _Moffstation/Structures/Storage/Crates/woodcrate.rsi
  - type: Damageable
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 15
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroyHeavy
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank1:
            min: 1
            max: 4
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Construction
    graph: CrateWood
    node: cratewood
    containers:
    - entity_storage
