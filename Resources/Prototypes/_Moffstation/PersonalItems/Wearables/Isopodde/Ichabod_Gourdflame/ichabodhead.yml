# Player: Isopodde / Character: Ichabod Gourdflame
- type: entity
  parent: ClothingHeadLightBase
  id: &id PersonalItemIchabodHead
  name: Ichabod's head
  suffix: PersonalItem
  description: A grinning mass-produced novelty Jack-O-Lantern hat.
  components:
  - type: Sprite
    sprite: &sprite Clothing/Head/Misc/pumpkin.rsi
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
  - type: Clothing
    sprite: *sprite
    clothingVisuals:
      mask:
      - state: equipped-helmet
      mask-vox:
      - state: equipped-helmet
    slots: [ mask ]
    equipDelay: 2s
    unequipDelay: 2s
  - type: ToggleableVisuals
    clothingVisuals:
      mask:
      - state: equipped-helmet-light
      mask-vox:
      - state: equipped-helmet-light-vox
  - type: PointLight
    enabled: false
    radius: 3
    energy: 1
    lightMask: ConeSingle
    autoRot: true
    color: "#cc6600"
    netsync: false
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
  - type: HideLayerClothing
    slots:
    - Hair
    - HeadTop
    - HeadSide
    - FacialHair
    - Snout
  - type: DetailExaminable
    content: The face seems to be making a slightly different expression every time you look at it. The eyes emit a faint glow.

- type: loadout
  id: *id
  storage:
    back:
    - *id
  effects:
  - !type:PersonalItemLoadoutEffect
    character:
    - Ichabod Gourdflame
