# Base for personal item pistols meant to replace the Mk58 pistol.
# Anything that inherits from this or includes something which inherits from this MUST be job-restricted to security.
- type: entity
  parent: WeaponPistolMk58
  id: BaseWeaponPersonalItemPistol
  abstract: true
  components:
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        # Spawns without a magazine
        insertSound: /Audio/Weapons/Guns/MagIn/pistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/pistol_magout.ogg
        priority: 2
        whitelist:
          tags:
          - MagazinePistol
          - MagazinePistolHighCapacity
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        # Spawns without ammo in the chamber
        priority: 1
        whitelist:
          tags:
          - CartridgePistol


- type: entity
  abstract: true
  parent: [BaseStorageItem, BaseSecurityContraband]
  id: BasePersonalItemPistolCase
  name: Mk9 gun case
  description: A slim, portable gun case intended to protect its contents. The outside is wrapped in blue tape.
  components:
  - type: Appearance
  - type: Sprite
    sprite: &case "_Moffstation/PersonalItems/Items/shared/personalpistolcase.rsi"
  - type: GenericVisualizer
    visuals:
      enum.StorageVisuals.Open:
        base:
          True: { state: icon-open }
          False: { state: icon }
  - type: Item
    sprite: *case
    size: Large
  - type: Storage
    maxItemSize: Large
    grid:
    - 0,0,1,0
    - 0,1,0,1
