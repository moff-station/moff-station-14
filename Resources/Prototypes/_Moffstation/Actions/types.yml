- type: entity
  parent: BaseAction
  id: ActionSlimeGrow
  name: Grow
  description: Concentrate and grow into a slimeperson.
  components:
  - type: Action
    useDelay: 600
  - type: Sprite
    sprite: Mobs/Aliens/slimes.rsi
    layers:
    - state: green_adult_slime
  - type: InstantAction
    event: !type:ReformEvent {}

- type: entity
  id: ActionMorphGeras
  name: Morph into Geras
  description:  Morphs you into a Geras - a miniature version of you which allows you to move fast, at the cost of your inventory.
  components:
  - type: ConfirmableAction
    popup: geras-transformation-popup
  - type: Action
    itemIconStyle: BigAction
    useDelay: 30 # prevent spam
    priority: 20
  - type: Sprite
    sprite: Mobs/Aliens/slimes.rsi
    layers:
    - state: blue_adult_slime
  - type: InstantAction
    event: !type:MorphGeras

- type: entity
  parent: BaseAction
  id: ActionSonicBoom
  name: Sonic Boom
  description: Emit a shockwave which flings everything around you.
  components:
  - type: Action
    checkCanInteract: false
    itemIconStyle: BigAction
    useDelay: 15.0
  - type: Sprite
    sprite: _Moffstation/Interface/Actions/actions_mothroach.rsi
    layers:
    - state: shockwave
  - type: InstantAction
    event: !type:AbilitySonicBoomEvent

- type: entity
  parent: BaseImplantAction
  id: ActivateSmokeImplant
  name: Release a cloud of smoke
  description: Releases a cloud of smoke around you.
  components:
  - type: Action
    itemIconStyle: BigAction
    checkCanInteract: false
    priority: -20
    raiseOnUser: false
    useDelay: 40 #intent of cooldown is 10 second grace period if spamming. Could be increased to 15 or more if problematic after testing
    sprite: Objects/Weapons/Grenades/smoke.rsi
    layers:
    - state: icon
