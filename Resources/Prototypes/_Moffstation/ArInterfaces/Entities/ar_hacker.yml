- type: entity
  id: ArHackerHolopadIndicator
  save: false
  components:
  - type: ArElement
    interface: ArHackerInterface
    spawnAt: !type:ArSpawnAtSource
      offset: 0,0
      angle: 0
  - type: Transform
    noRot: false
  - type: Sprite
    sprite: _Moffstation/ArInterfaces/hacker.rsi
    layers:
    - state: holopad
      renderingStrategy: NoRotation
    #state: holopad
    visible: false
    #noRot: true
  - type: ArSightIndicator
  - type: SightDetector
    range: 3
    key: viewer
  - type: VisualLinks
    linkSprite:
      sprite: _Moffstation/ArInterfaces/hacker.rsi
      state: link

- type: entity
  id: ArHackerCameraIndicator
  save: false
  components:
  - type: ArElement
    interface: ArHackerInterface
    spawnAt: !type:ArSpawnAtSource
      offset: -0.25, -0.4
      angle: 0
  - type: Transform
    noRot: false
  - type: Sprite
    sprite: _Moffstation/ArInterfaces/hacker.rsi
    layers:
    - state: camera
      renderingStrategy: NoRotation
    #state: holopad
    visible: false
    #noRot: true
    noRot: true
  - type: ArSightIndicator
  - type: SightDetector
    range: 8
    key: viewer
  - type: VisualLinks
    linkSprite:
      sprite: _Moffstation/ArInterfaces/hacker.rsi
      state: link

- type: entity
  id: ArHackerViewerIndicator
  save: false
  components:
  - type: ArElement
    interface: ArHackerInterface
    spawnAt: !type:ArSpawnAtViewer
      offset: 0,0
      angle: 0
  - type: Transform
    noRot: false
  - type: Sprite
    sprite: _Moffstation/ArInterfaces/hacker.rsi
    state: camera # todo : change that !
    visible: false
    noRot: true
  - type: SightDetectorTarget
    key: viewer
