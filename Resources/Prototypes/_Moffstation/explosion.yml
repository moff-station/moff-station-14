# Invisible versions of upstream explosions; the fire tiles and light are hidden so the explosion effects can be seen.
- type: explosion
  id: Transparent
  damagePerIntensity:
    types:
      Heat: 5
      Blunt: 5
      Piercing: 5
  fireColor: Transparent
  tileBreakChance: [0, 0.5, 1]
  tileBreakIntensity: [0, 10, 30]
  tileBreakRerollReduction: 20
  lightColor: Black
  texturePath: /Textures/Effects/fire.rsi
  fireStates: 3
  temperature: 800

