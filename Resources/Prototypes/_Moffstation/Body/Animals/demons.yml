- type: entity
  parent: [ Ash, OrganBaseBrain ]
  id: OrganDemonicEssence
  name: demonic essence
  components:
  - type: Sprite
    sprite: _Moffstation/Objects/Materials/demonic_essence.rsi
    layers:
    - state: demonic_essence
  - type: SolutionManager
    solutions:
    - SolutionStomach
  - type: Stomach
  - type: Lung
  - type: Metabolizer
    metabolizerTypes: [ Bloodsucker ] # They can 'drink' blood to heal
    stages: [ Digestion, Bloodstream, Metabolites ]

- type: entity
  id: BaseMobDemons
  abstract: true
  components:
  - type: Body
  - type: EntityTableContainerFill
    containers:
      body_organs: !type:AllSelector
        children:
        - id: OrganDemonicEssence
