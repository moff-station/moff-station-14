- type: entity
  abstract: true
  id: BaseAnomalyMob
  name: anomalous creature
  suffix: Anomaly
  description: An unstable manifestation of the natural order, broken.
  components:
  - type: PointLight
    radius: 1.3
    energy: 2.5
    castShadows: false
  - type: ActionGrant
    actions:
    - ActionAnomalyPulse

- type: entity
  parent: [MobCatShadow, MobNightVision, BaseAnomalyMob]
  id: AnomalyMobShadowCat
  description: A lovely piece of darkness. Hope it doesn't bring you a curse.
  components:
  - type: PointLight
    color: "#793a80"
  - type: Anomaly
    maxPointsPerSecond: 100
    corePrototype: AnomalyCoreShadow
    coreInertPrototype: AnomalyCoreShadowInert
    supercriticalSoundAtAnimationStart:
      collection: AnomalyShadowSupercritical
  - type: LightExtinguisher
