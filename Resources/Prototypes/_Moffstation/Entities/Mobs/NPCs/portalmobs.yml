## Nar'Sie demons
# Base Prototypes
- type: entity
  abstract: true
  parent: [ BaseMobDemons, SimpleSpaceMobBase, BaseMobDestructible ]
  id: MoffMobDemonNarsieBase
  name: narsian demon
  suffix: Hellportal
  description: A runecarved fiend of blood and shadow.
  components:
  - type: HellportalMob
  - type: NpcFactionMember
    factions:
    - NarsianDemon
  - type: MobState
    allowedStates:
    - Alive
    - Dead
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Dead
  - type: SlowOnDamage
    speedModifierThresholds:
      80: 0.7
  - type: TriggerOnMobstateChange
    mobState:
    - Dead
  - type: GibOnTrigger
    deleteItems: true
  - type: SpawnOnTrigger
    proto: Acidifier
    predicted: true
  - type: MeleeWeapon
    soundHit:
      collection: AlienClaw
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 6
  - type: Hands
  - type: ComplexInteraction
  - type: Speech
    speechVerb: Ghost
    speechSounds: Arachnid
  - type: Prying
    pryPowered: true
    force: true
    speedModifier: 1.5
    useSound:
      path: /Audio/Items/crowbar.ogg
  - type: MovementAlwaysTouching
  - type: MovementSpeedModifier
    baseWalkSpeed: 1.25
    baseSprintSpeed: 2.25
  - type: Vocalizer
    hideChat: true
  - type: DatasetVocalizer
    dataset: NarSiePrayers
  - type: HTN
    rootTask:
      task: SimpleNarsieDemonCompound
    blackboard:
      NavClimb: !type:Bool
        true
      NavInteract: !type:Bool
        true
      NavPry: !type:Bool
        true
      NavSmash: !type:Bool
        true
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Blood
        Quantity: 100
  - type: Tag
    tags:
    - DoorBumpOpener

- type: entity
  abstract: true
  parent: MoffMobDemonNarsieBase
  id: MoffMobDemonNarsieFleshBase
  name: writhing flesh
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: Mobs/Aliens/flesh.rsi
  - type: MobThresholds
    thresholds:
      0: Alive
      75: Dead
  - type: SlowOnDamage
    speedModifierThresholds:
      60: 0.7
  - type: MovementSpeedModifier
    baseWalkSpeed: 0.625
    baseSprintSpeed: 1.125
  - type: Tag
    tags:
    - DoorBumpOpener
    - Flesh

- type: entity
  abstract: true
  parent: MoffMobDemonNarsieBase
  id: MoffMobDemonNarsieConstructBase
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _Moffstation/Mobs/Demons/shade.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: construct_body
    - map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ]
      state: glow_red
      shader: unshaded
  - type: DamageStateVisuals
    states:
      Alive:
        Base: construct_body
        BaseUnshaded: glow_red
      Dead:
        Base: construct_body
        BaseUnshaded: null
  - type: Speech
    speechSounds: SyndieBorg

# Fleshlings
- type: entity
  parent: MoffMobDemonNarsieFleshBase
  id: MoffMobDemonNarsieFleshClamp
  components:
  - type: Sprite
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: clamp
  - type: DamageStateVisuals
    states:
      Alive:
        Base: clamp
      Dead:
        Base: dead
  - type: MobThresholds
    thresholds:
      0: Alive
      30: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 1.25
    baseSprintSpeed: 2.25

- type: entity
  parent: MoffMobDemonNarsieFleshBase
  id: MoffMobDemonNarsieFleshGolem
  components:
  - type: Sprite
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: golem
  - type: DamageStateVisuals
    states:
      Alive:
        Base: golem
      Dead:
        Base: dead

- type: entity
  parent: MoffMobDemonNarsieFleshBase
  id: MoffMobDemonNarsieFleshJared
  components:
  - type: Sprite
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: jared
  - type: DamageStateVisuals
    states:
      Alive:
        Base: jared
      Dead:
        Base: dead

- type: entity
  parent: MoffMobDemonNarsieFleshBase
  id: MoffMobDemonNarsieFleshLover
  components:
  - type: Sprite
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: lover
  - type: DamageStateVisuals
    states:
      Alive:
        Base: lover
      Dead:
        Base: dead
  - type: MobThresholds
    thresholds:
      0: Alive
      30: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 1.25
    baseSprintSpeed: 2.25

# Narsian constructs
- type: entity
  parent: MoffMobDemonNarsieConstructBase
  id: MoffMobDemonNarsieArtificer
  name: narsian artificer
  components:
  - type: Sprite
    sprite: _Moffstation/Mobs/Demons/artificer.rsi
  - type: HTN
    rootTask:
      task: NarsieArtificerCompound
    blackboard:
      NavClimb: !type:Bool
        true
      NavInteract: !type:Bool
        true
      NavPry: !type:Bool
        true
      NavSmash: !type:Bool
        true

- type: entity
  parent: MoffMobDemonNarsieConstructBase
  id: MoffMobDemonNarsieHarvester
  name: narsian harvester
  components:
  - type: Sprite
    sprite: _Moffstation/Mobs/Demons/harvester.rsi
  - type: Puller
    needsHands: false

- type: entity
  parent: MoffMobDemonNarsieConstructBase
  id: MoffMobDemonNarsieJuggernaut
  name: narsian juggernaut
  components:
  - type: Sprite
    sprite: _Moffstation/Mobs/Demons/juggernaut.rsi
  - type: MeleeThrowOnHit
    distance: 1
    speed: 1
  - type: MeleeWeapon
    soundHit:
      path: "/Audio/Effects/metal_slam4.ogg"
    animation: WeaponArcClaw
    attackRate: 0.5
    damage:
      types:
        Blunt: 33
        Structural: 45
  - type: MobThresholds
    thresholds:
      0: Alive
      150: Dead
  - type: SlowOnDamage
    speedModifierThresholds:
      120: 0.7
  - type: MovementSpeedModifier
    baseWalkSpeed: 0.625
    baseSprintSpeed: 1.125

- type: entity
  parent: MoffMobDemonNarsieConstructBase
  id: MoffMobDemonNarsieShade
  name: narsian shade
  components:
  - type: Gun
    fireRate: 0.25
    projectileSpeed: 15.0
    selectedMode: SemiAuto
    showExamineText: false
    availableModes: [ SemiAuto ]
    soundGunshot: /Audio/Weapons/Guns/Gunshots/syringe_gun.ogg
  - type: BasicEntityAmmoProvider
    ammoTable:
      id: MoffBloodBolt
    capacity: 1
    count: 1
  - type: RechargeBasicEntityAmmo
    showExamineText: false
    rechargeCooldown: 0
    rechargeSound: null
  - type: HTN
    rootTask:
      task: GlockroachCompound


- type: entity
  parent: MoffMobDemonNarsieConstructBase
  id: MoffMobDemonNarsieWraith
  name: narsian wraith
  components:
  - type: Sprite
    sprite: _Moffstation/Mobs/Demons/wraith.rsi
  - type: NPCUseActionOnTarget
    actionId: ActionPolymorphWraithJaunt
  - type: MovementSpeedModifier
    baseWalkSpeed: 1.875
    baseSprintSpeed: 3.375

- type: entity
  parent: BaseActionPolymorph
  id: ActionPolymorphWraithJaunt
  name: Abyssal Jaunt
  description: Melt into the the shadows, ambush your prey
  components:
  - type: Action
    useDelay: 10
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    layers:
    - state: jaunt
  - type: InstantAction
    event: !type:PolymorphActionEvent
      protoId: WraithJaunt

- type: entity
  parent: BaseMobJaunt
  id: WraithJaunt
  name: narsian wraith
  suffix: Hellportal, Jaunt
  components:
  - type: Sprite
    sprite: Mobs/Ghosts/ghost_human.rsi
    color: "#690d2a"
    layers:
    - state: animated
      shader: unshaded
    noRot: true
    overrideContainerOcclusion: true
    drawdepth: Ghosts
  - type: MovementSpeedModifier
    baseWalkSpeed: 4
    baseSprintSpeed: 6
  - type: TriggerOnSpawn
  - type: SpawnOnTrigger
    proto: EffectWraithJaunt
  - type: NpcFactionMember
    factions:
    - NarsianDemon
  - type: CombatMode
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 0
    hitSound: null
    attackRate: 0.1
  - type: HTN
    rootTask:
      task: NarsieWraithJauntCompound
