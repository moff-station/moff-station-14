# REMEMBER TO FIX LATER
- type: entity
  #parent: [ BaseHellportalMob, MobAbomination ]
  parent: MobAbomination
  id: MobAbominationSmasher

  #categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _Moffstation/Mobs/Demons/artificer.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: artificer
    - map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ]
      state: artificer_red
      shader: unshaded
  - type: DamageStateVisuals
    states:
      Alive:
        Base: artificer
        BaseUnshaded: artificer_red
      Dead:
        Base: artificer
        BaseUnshaded: null

