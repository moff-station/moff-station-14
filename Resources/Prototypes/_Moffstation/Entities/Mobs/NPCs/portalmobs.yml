## Nar'Sie demons
# Base Prototypes
- type: entity
  abstract: true
  parent: [ BaseMobDemons, SimpleSpaceMobBase, BaseMobDestructible ]
  id: MoffMobDemonNarsieBase
  name: narsian demon
  suffix: Hellportal
  description: A runecarved fiend of blood and shadow.
  components:
  - type: HellportalMob
  - type: NpcFactionMember
    factions:
    - NarsianDemon
  - type: MobState
    allowedStates:
    - Alive
    - Dead
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Dead
  - type: SlowOnDamage
    speedModifierThresholds:
      80: 0.7
  - type: TriggerOnMobstateChange
    mobState:
    - Dead
  - type: GibOnTrigger
    deleteItems: true
  - type: SpawnOnTrigger
    proto: Acidifier
    predicted: true
  - type: MeleeWeapon
    soundHit:
      collection: AlienClaw
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 6
  - type: Hands
  - type: ComplexInteraction
  - type: Speech
    speechVerb: Ghost
    speechSounds: Arachnid
  - type: Prying
    pryPowered: true
    force: true
    speedModifier: 1.5
    useSound:
      path: /Audio/Items/crowbar.ogg
  - type: MovementAlwaysTouching
  - type: MovementSpeedModifier
    baseWalkSpeed: 1
    baseSprintSpeed: 1.5
  - type: Vocalizer
    hideChat: true
  - type: DatasetVocalizer
    dataset: NarSiePrayers
  - type: HTN
    rootTask:
      task: SimpleNarsieDemonCompound
    blackboard:
      NavClimb: !type:Bool
        true
      NavInteract: !type:Bool
        true
      NavPry: !type:Bool
        true
      NavSmash: !type:Bool
        true
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Blood
        Quantity: 100
  - type: Tag
    tags:
    - DoorBumpOpener

- type: entity
  abstract: true
  parent: MoffMobDemonNarsieBase
  id: MoffMobDemonNarsieFleshBase
  name: writhing flesh
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: Mobs/Aliens/flesh.rsi
  - type: MobThresholds
    thresholds:
      0: Alive
      75: Dead
  - type: SlowOnDamage
    speedModifierThresholds:
      60: 0.7
  - type: Tag
    tags:
    - DoorBumpOpener
    - Flesh

- type: entity
  abstract: true
  parent: MoffMobDemonNarsieBase
  id: MoffMobDemonNarsieConstructBase
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _Moffstation/Mobs/Demons/shade.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: construct_body
    - map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ]
      state: glow_red
      shader: unshaded
  - type: DamageStateVisuals
    states:
      Alive:
        Base: construct_body
        BaseUnshaded: glow_red
      Dead:
        Base: construct_body
        BaseUnshaded: null
  - type: Speech
    speechSounds: SyndieBorg

# Fleshlings
- type: entity
  parent: MoffMobDemonNarsieFleshBase
  id: MoffMobDemonNarsieFleshClamp
