# Nar'Sie demons
# Base Prototypes
- type: entity
  abstract: true
  parent: [ BaseMobDemons, SimpleSpaceMobBase, BaseMobDestructible ]
  id: MoffMobDemonNarsieBase
  name: narsian demon
  suffix: Hellportal
  description: A runecarved fiend of blood and shadow.
  components:
  - type: HellportalMob
  - type: NpcFactionMember
    factions:
    - NarsianDemon
  - type: MobState
    allowedStates:
    - Alive
    - Dead
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Dead
  - type: SlowOnDamage
    speedModifierThresholds:
      80: 0.7
  - type: TriggerOnMobstateChange
    mobState:
    - Dead
  - type: GibOnTrigger
    deleteItems: true
  - type: SpawnOnTrigger
    proto: Acidifier
    predicted: true
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Weapons/Xeno/alien_claw_flesh3.ogg
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 6
  - type: Hands
  - type: ComplexInteraction
  - type: Speech
    speechVerb: Ghost
    #speechSounds: SyndieBorg
    speechSounds: Slime
  - type: Prying
    pryPowered: true
    force: true
    speedModifier: 1.5
    useSound:
      path: /Audio/Items/crowbar.ogg
  - type: MovementAlwaysTouching
  - type: MovementSpeedModifier
    baseWalkSpeed: 1
    baseSprintSpeed: 1.5
  - type: Vocalizer
  - type: DatasetVocalizer
    dataset: NarSiePrayers
  - type: HTN
    rootTask:
      task: SimpleNarsieDemonCompound
    blackboard:
      NavClimb: !type:Bool
        true
      NavInteract: !type:Bool
        true
      NavPry: !type:Bool
        true
      NavSmash: !type:Bool
        true
      MinimumIdleTime: !type:Single
        0.5
      MaximumIdleTime: !type:Single
        0.5
      Count: !type:Single
        0

- type: entity
  abstract: true
  parent: MoffMobDemonNarsieBase
  id: MoffMobDemonNarsieFleshBase
  components:
  - type: Speech
    speechSounds: Slime
  - type: Sprite
    drawdepth: Mobs
    sprite: Mobs/Aliens/flesh.rsi

- type: entity
  abstract: true
  parent: MoffMobDemonNarsieBase
  id: MoffMobDemonNarsieConstructBase
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _Moffstation/Mobs/Demons/shade.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: construct_body
    - map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ]
      state: glow_red
      shader: unshaded
  - type: DamageStateVisuals
    states:
      Alive:
        Base: construct_body
        BaseUnshaded: glow_red
      Dead:
        Base: construct_body
        BaseUnshaded: null
  - type: Speech
    speechSounds: SyndieBorg

