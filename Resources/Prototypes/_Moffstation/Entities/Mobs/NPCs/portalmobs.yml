      Alive:
        Base: jared
      Dead:
        Base: dead

- type: entity
  parent: MoffMobDemonNarsieFleshBase
  id: MoffMobDemonNarsieFleshLover
  components:
  - type: Sprite
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: lover
  - type: DamageStateVisuals
    states:
