# CentComm intern
- type: entity
  parent: RandomHumanoidSpawnerCentcomOfficial
  id: RandomHumanoidSpawnerCentcomIntern
  name: CentComm intern
  components:
  - type: Sprite
    sprite: Markers/jobs.rsi
    state: centcom
  - type: RandomHumanoidSpawner
    settings: CentcomIntern

- type: randomHumanoidSettings
  parent: CentcomOfficial
  id: CentcomIntern
  components:
  - type: Loadout
    prototypes: [ CentcommInternGear ]
    roleLoadout: [ RoleSurvivalStandard ]
  - type: AutoImplant
    implants:
    - DeathRattleImplantCentcomm
  - type: RandomMetadata
    nameSegments:
    - NamesFirst
    - NamesLast
    nameFormat: name-format-standard # No fancy names for interns - go die for Nanotrasen

# ERT Team Leaders, with a lower rank - they lead 4-man fireteams within a larger ERT deployment.
- type: entity
  parent: RandomHumanoidSpawnerERTLeaderArmed
  id: RandomHumanoidSpawnerERTLeaderArmedTeam
  name: ERT fireteam leader
  suffix: ERTRole, Armed, EVA
  components:
  - type: RandomHumanoidSpawner
    settings: ERTLeaderArmedTeam

- type: randomHumanoidSettings
  parent: ERTLeaderEVA
  id: ERTLeaderArmedTeam
  components:
  - type: GhostRole
    name: ghost-role-information-ert-team-leader-name
    description: ghost-role-information-ert-team-leader-description
    rules: ghost-role-information-nonantagonist-rules
    raffle:
      settings: short
    job: ERTLeader
  - type: Loadout
    prototypes: [ ERTLeaderGearArmedTeam ]
    roleLoadout: [ RoleSurvivalMilitaryDouble ]
  - type: RandomMetadata
    nameSegments:
    - NamesMilitaryLast
    nameFormat: name-format-ert-team-leader

