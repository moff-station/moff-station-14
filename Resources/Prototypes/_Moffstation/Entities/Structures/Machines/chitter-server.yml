- type: entity
  #  abstract: true
  id: MoffBaseChitterServer
  description: A machine which routes and stores messages for the Chitter instant messaging service.
  components:
  - type: ChitterServer
    emagEffects: !type:GroupSelector
      children:
      - id: ChitterEmagEffectSyndicateIntern
        weight: 4
      - id: ChitterEmagEffectClown
        weight: 1
  - type: Machine
    board: ChitterBladeServerMachineCircuitboard
  - type: ApcPowerReceiver
    powerLoad: 200
  - type: ExtensionCableReceiver
  - type: WiresVisuals
  - type: WiresPanel
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }

- type: entity
  parent: [ MoffBaseChitterServer, BaseMachinePowered, ConstructibleMachine, StructureHealthMachineStrong ]
  id: MoffChitterServer
  name: Chitter server
  components:
  - type: Sprite
    sprite: Structures/Machines/server.rsi
    snapCardinals: true
    layers:
    - state: server-off
    - state: server-on
      visible: false
      map: [ "enum.PowerDeviceVisualLayers.Powered" ]
    - state: variant-crew
    - state: server_o
      map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
  - type: Construction
    graph: Machine
    node: machine
    containers:
    - machine_board
    - machine_parts
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: Damageable
    damageModifierSet: SteelMod
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 275
      behaviors:
      - !type:ChangeConstructionNodeBehavior
        node: machineFrame
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
  - type: AmbientOnPowered
  - type: AmbientSound
    volume: -9
    range: 5
    enabled: false
    sound:
      collection: ServerFans
