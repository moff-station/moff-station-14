# TODO: Balance draw rate, capacity and price
- type: entity
  parent: BaseMachine
  id: GaussFabricator
  name: gaussian fabrication unit
  description: A high-voltage fabrication unit that channels raw HV current through precision electromagnetic coils, slowly crystallizing dense magnetic alloy as a byproduct. The hum is normal.
  components:
  - type: Sprite
    sprite: _Moffstation/Structures/Machines/gauss_fabricator.rsi
    snapCardinals: true
    layers:
    - state: icon
    - state: screen
      shader: unshaded
      map: [ "screen" ]
      visible: false
    - state: sparks
      shader: unshaded
      map: [ "sparks" ]
      visible: false
    - state: lightning
      shader: unshaded
      map: [ "lightning" ]
      visible: false
  - type: PointLight
    enabled: false
    color: "#33ccff"
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        screen:
          True: { visible: true }
          False: { visible: false }
        sparks:
          True: { visible: true }
          False: { visible: false }
        lightning:
          True: { visible: true }
          False: { visible: false }
  - type: NodeContainer
    examinable: true
    nodes:
      input:
        !type:CableDeviceNode
        nodeGroupID: HVPower
  - type: BatteryCharger
    voltage: High
  - type: PowerNetworkBattery
    canDischarge: false
  - type: Battery
    maxCharge: 10000000
    startingCharge: 0
    netsync: false
  - type: AmbientSound
    range: 10
    sound:
      path: /Audio/Ambience/Objects/buzzing.ogg
  - type: LightningTarget
    priority: 2
  - type: GaussFabricator
  - type: SpawnOnBatteryFull
    proto: MoffRefinedConductorIngot
  - type: AccessReader
    access: [["Engineering"]]
  - type: ActivatableUIRequiresAccess
  - type: ActivatableUI
    key: enum.GaussFabricatorUiKey.Key
  - type: UserInterface
    interfaces:
      enum.GaussFabricatorUiKey.Key:
        type: GaussFabricatorBoundUserInterface
  - type: StaticPrice
    price: 2000

- type: entity
  parent: BaseItem
  id: MoffRefinedConductorIngot
  name: gaussian hypermagnet
  description: A dense magnet crystallized by intense electromagnetic fields. Highly sought after for its unusual magnetic properties.
  components:
  - type: Sprite
    sprite: _Moffstation/Objects/Materials/gaussian_hypermagnet.rsi
    layers:
    - state: icon
      shader: unshaded
  - type: Item
    size: Small
    heldPrefix: silver
    sprite: Objects/Materials/ingots.rsi
  - type: StaticPrice
    price: 200
