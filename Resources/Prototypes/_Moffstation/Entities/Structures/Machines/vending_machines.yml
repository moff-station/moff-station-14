- type: entity
  parent: VendingMachine
  id: MoffVendingMachineSwimsuits
  name: SwimVend
  description: A vending machine for swimsuits.
  components:
  - type: VendingMachine
    pack: SwimvendInventory
    initialStockQuality: 0.80
  - type: DatasetVocalizer
    dataset: SwimVendAds
  - type: SpeakOnUIClosed
    pack: SwimVendGoodbyes
  - type: Sprite
    sprite: _Moffstation/Structures/Machines/VendingMachines/swimsuits.rsi
    layers:
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: PointLight
    radius: 1.8
    energy: 1.6
    color: "#00ffb4"

- type: entity
  parent: VendingMachine
  id: MoffVendingMachineNanoTrasen
  name: NanoVend
  description: A vending machine for all things Nanotrasen! Glory to Nanotrasen!
  components:
  - type: VendingMachine
    pack: NanovendInventory
    initialStockQuality: 0.95
  - type: DatasetVocalizer
    dataset: NanoVendAds
  - type: SpeakOnUIClosed
    pack: NanoVendGoodbyes
  - type: Sprite
    sprite: _Moffstation/Structures/Machines/VendingMachines/nanovend.rsi
    layers:
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: PointLight
    radius: 1.8
    energy: 1.6
    color: "#4B709CFF"
