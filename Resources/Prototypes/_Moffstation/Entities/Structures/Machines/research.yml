# This was peeled off of upstream's `ResearchAndDevelopmentServer`. Changes to that prototype from upstream should be
# carefully considered to be added here or there, depending on whether it should affect just the machine variant, or all
# variants of the R&D server.
- type: entity
  id: BaseResearchAndDevelopmentServer
  abstract: true
  components:
  - type: ResearchServer
  - type: Machine
    board: ResearchAndDevelopmentServerMachineCircuitboard
  - type: TechnologyDatabase
    supportedDisciplines:
    - Industrial
    - Arsenal
    - Experimental
    - CivilianServices
  - type: ApcPowerReceiver
    powerLoad: 200
  - type: ExtensionCableReceiver
  - type: WiresPanel
  - type: WiresVisuals
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
  - type: GuideHelp
    guides:
    - Science

# Moffstation - Blade Server Rack migration
# Replaces the standalone R&D server on maps (see Resources/migration.yml) with a rack pre-loaded with the R&D
# blade server and a Chitter blade server, so every station keeps working R&D and gets Chitter for free.
- type: entity
  id: ResearchAndDevelopmentServerRack
  parent: BladeServerRack
  name: R&D server rack
  description: A blade server rack pre-loaded with the station's R&D blade server and a Chitter communications blade.
  components:
  - type: BladeServerRack
    startingContents:
    - ResearchAndDevelopmentBladeServer
    - ChitterBladeServer
