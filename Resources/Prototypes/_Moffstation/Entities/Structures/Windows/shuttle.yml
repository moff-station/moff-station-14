- type: entity
  parent: ShuttleWindow
  id: ShuttleSovietWindow
  name: shuttle window
  suffix: USSP
  components:
  - type: Sprite
    drawdepth: WallTops
    sprite: _Moffstation/Structures/Windows/soviet_shuttle_window.rsi
  - type: Icon
    sprite: _Moffstation/Structures/Windows/soviet_shuttle_window.rsi
  # Moff start - Moff shuttle window sprites only have the 8 corner states
  - type: IconSmooth
    key: windows-shuttle
    states:
    - !type:CornerSpriteSmoothing # Readd 8-sprite smoothing vs new 14
      mask:
      - windows-shuttle
      - windows
      - windows-reinf
      - windows-tinted
      - windows-plasma
      - windows-plasma-reinf
      - windows-uranium
      - windows-uranium-reinf
      - windows-exo
      - windows-plastitanium
      - windows-regal
      - walls-exo
      - walls-shuttle
      - walls-plastitanium
      - walls-material
      - walls-marble
      - walls
      - grilles
      - doors
      base: swindow
    # Moff end

- type: entity
  parent: ShuttleWindowDiagonal
  id: ShuttleSovietWindowDiagonal
  name: shuttle window
  suffix: USSP
  components:
  - type: Sprite
    drawdepth: WallTops
    sprite: _Moffstation/Structures/Windows/soviet_shuttle_window_diagonal.rsi
    state: state0
  - type: Icon
    sprite: _Moffstation/Structures/Windows/soviet_shuttle_window_diagonal.rsi
    state: state0
