# Ironsand

- type: entity
  parent: BaseWall
  id: MoffIronSandstone
  name: ironsandstone
  suffix: no ore yield
  components:
  - type: Transform
    noRot: true
  - type: IconSmooth
    key: walls
    states:
    - !type:EdgeSpriteSmoothing
      mask: [ walls ]
      base: ironsandstone_
  - type: Icon
    sprite: _Moffstation/Structures/Walls/ironsandstone.rsi
    state: ironsandstone
  - type: Sprite
    sprite: _Moffstation/Structures/Walls/ironsandstone.rsi
    layers:
    - state: ironsandstone
  - type: MiningScannerViewable
  - type: Damageable
    damageModifierSet: Rock
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 2000
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 120
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
          params:
            volume: -6

- type: entity
  parent: MoffIronSandstone
  id: MoffIronSandstoneMining
  name: ironsandstone
  suffix: higher ore yield
  components:
  - type: OreVein
    oreChance: 0.33
    oreRarityPrototypeId: RandomOreDistributionStandard
