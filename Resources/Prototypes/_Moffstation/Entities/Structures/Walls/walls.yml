- type: entity
  parent: WallPlastitanium
  id: WallSovietPlastitanium
  name: plastitanium wall
  suffix: USSP
  components:
  - type: Sprite
    sprite: _Moffstation/Structures/Walls/soviet_plastitanium.rsi
  - type: Icon
    sprite: _Moffstation/Structures/Walls/soviet_plastitanium.rsi
  # Moff start - Moff plastitanium wall sprites only have the 8 corner states
  - type: IconSmooth
    key: walls-plastitanium
    states:
    - !type:CornerSpriteSmoothing # Readd 8-sprite smoothing vs new 14
      mask:
      - walls-plastitanium
      - windows
      - windows-reinf
      - windows-tinted
      - windows-plasma
      - windows-plasma-reinf
      - windows-uranium
      - windows-uranium-reinf
      - windows-exo
      - windows-shuttle
      - windows-plastitanium
      - windows-regal
      - walls-exo
      - walls-shuttle
      - walls-material
      - walls-marble
      - walls
      - grilles
      - doors
      base: plastitanium
    # Moff end

- type: entity
  parent: WallPlastitaniumDiagonal
  id: WallSovietPlastitaniumDiagonal
  name: plastitanium wall
  suffix: USSP
  components:
  - type: Sprite
    drawdepth: Walls
    sprite: _Moffstation/Structures/Walls/soviet_plastitanium_diagonal.rsi
    state: state0
  - type: Icon
    sprite: _Moffstation/Structures/Walls/soviet_plastitanium_diagonal.rsi
    state: state0

- type: entity
  parent: BaseWall # Originally parented to WallCobblebrick, but that's gone now
  id: WallMoffIronsandCobblebrick
  name: ironsand brick wall
  description: The pale, rounded shapes that make up this wall look strikingly different from the iron sands they were allegedly made from.
  components:
  - type: Sprite
    sprite: _Moffstation/Structures/Walls/cobblebrick_ironsand.rsi
  - type: Icon
    sprite: _Moffstation/Structures/Walls/cobblebrick_ironsand.rsi
  - type: IconSmooth
    key: cobblebricks
    states:
    - !type:CornerSpriteSmoothing
      mask: [ cobblebricks ]
      base: cobblebrick
  - type: RCDDeconstructable
    deconstructable: false
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
          params:
            volume: -6
      - !type:SpawnEntitiesBehavior
        spawn:
          SteelOre1:
            min: 0
            max: 2
