- type: entity
  abstract: true
  parent: [ ChairBase, StructureHealthFurniture ]
  id: MoffSofaBase
  name: sofa
  description: Multiple seats spanning a single object. Truly a marvel of science.
  components:
  - type: Sprite
    sprite: _Moffstation/Structures/Furniture/Sofas/sofa.rsi
  - type: Damageable
    damageModifierSet: SteelMod

# White

- type: entity
  parent: SofaBase
  id: MoffSofaMiddle
  name: sofa
  suffix: middle
  components:
