- type: entity
  parent: SeatBase
  abstract: true
  id: SofaBase
  name: sofa
  description: Multiple seats spanning a single object. Truly a marvel of science.
  placement:
    mode: SnapgridCenter
  components:
  - type: Physics
    bodyType: Static
  - type: Transform
    anchored: true
  - type: Rotatable
  - type: Sprite
    sprite: _Moffstation/Structures/Furniture/Sofas/sofa.rsi
  - type: Clickable
  - type: InteractionOutline
  - type: Pullable
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: StaticPrice
    price: 50

# White

- type: entity
  parent: SofaBase
  id: SofaMiddle
  name: sofa
  suffix: middle
  components:
  - type: Sprite
    sprite: _Moffstation/Structures/Furniture/Sofas/sofa.rsi
    state: middle
  - type: Construction
    graph: SofasGraph
    node: SofaMiddleNode

