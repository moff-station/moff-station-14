- type: entity
  abstract: true
  id: MoffClothingHeadToggleableWeldingMask
  name: base helmet toggleable welding mask
  categories: [ HideSpawnMenu ]
  components:
  - type: HelmetVisor
    isActive: true
    components:
    - type: EyeProtection
    - type: FlashImmunity
    - type: WeldingMaskOverlay
      texture: /Textures/_Funkystation/Clothing/Head/Welding/weldingOverlay.png
  - type: GenericVisualizer
    visuals:
      enum.HelmetVisorVisuals.IsDown:
        visor_icon:
          False: { visible: false }
          True: { visible: true, state: icon-up }
        unshaded_base:
          False: { visible: true }
          True: { visible: false }

- type: entity
  abstract: true
  parent: [ MoffClothingHeadToggleableWeldingMask, ClothingHeadSuitWithLightBase ]
  id: MoffClothingHeadSuitToggleableWeldingMaskWithLight
  name: base helmet toggleable welding mask
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - state: icon
    - state: icon-unshaded
      shader: unshaded
    - state: light-overlay
      visible: false
      shader: unshaded
      map: [ "light" ]
    - state: icon-up
      visible: false
      map: [ "visor_icon" ]

# Welding mask action
- type: entity
  parent: BaseAction
  id: ActionToggleHelmetVisor
  name: Toggle Visor
  description: Flips the helmet visor up or down.
  components:
  - type: Action
  - type: InstantAction
    event: !type:ToggleHelmetVisorEvent
  - type: Sprite
    sprite: Clothing/Head/Welding/welding.rsi
    layers:
    - state: icon
      map: ["enum.ActionVisuals.Icon"]
    - state: ""
      map: ["enum.ActionVisuals.IconToggled"]
      visible: false
