- type: entity
  parent: BaseItem
  id: PhotoCamera
  name: photo camera
  description: Capture a Precious moment, Ruining it right after with the Integrated Flash
  components:
  - type: SnapshotCamera
    photograph: SnapshotPhotograph
  - type: Sprite
    sprite: Objects/Devices/travel_camera.rsi
    state: icon
  - type: Flash
    flashOnUse: false
    flashOnRangedInteract: false
    sound: !type:SoundPathSpecifier
      path: /Audio/Misc/camera_snap.ogg
  # Only applied while looking through the viewfinder, like binoculars.
  - type: EyeCursorOffset
    maxOffset: 5
    pvsIncrease: 0.5
  - type: LimitedCharges
    maxCharges: 4
  - type: AutoRecharge
    rechargeDuration: 60
  - type: UseDelay
  - type: StaticPrice
    price: 100
  - type: Clothing
    slots:
    - NECK
    sprite: Objects/Devices/travel_camera.rsi

- type: entity
  parent: BasePaper
  id: SnapshotPhotograph
  name: photograph
  description: A photograph of something someone thought worth remembering.
  components:
  - type: Sprite
    sprite: Objects/Misc/photograph.rsi
    layers:
    - state: black
  - type: Item
    # no inhand sprite yet so i steal the paper one.
    sprite: Objects/Misc/bureaucracy.rsi
  - type: ActivatableUI
    key: enum.PhotoUiKey.Key
    requiresComplex: false
  - type: UserInterface
    interfaces:
      enum.PhotoUiKey.Key:
        type: PhotoBoundUserInterface
