- type: entity
  parent: [ BaseMachine, BaseItem, BaseSyndicateContraband, StructureHealthMachine ]
  id: MoffChitterMpnServer
  name: Chitter M.P.N.
  description: A server for a miniature private network Chitter instance, all contained in a sturdy red housing with a
    sinister looking "S" emblazoned on the top.
  components:
  - type: Transform
    noRot: false
  - type: ChitterServer
    discoverable: false
  - type: ChitterMpnServer
  - type: Sprite
    sprite: _Moffstation/Structures/Machines/chitter_mpn_server.rsi
    layers:
    - state: base
    - state: base-powered
      unshaded: true
      visible: false
      map: [ "enum.PowerDeviceVisualLayers.Powered" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
  - type: NodeContainer
    examinable: true
    nodes:
      input: !type:CableDeviceNode
        nodeGroupID: MVPower
  - type: PowerConsumer
    voltage: Medium
    drawRate: 50
  - type: PowerConsumerVisuals
  - type: Tag
    tags:
    - EmagImmune
  - type: LightningTarget
    priority: 1
  - type: ESSparkOnHit
    prob: 0.25
    count: 2
  - type: ESSparkCooldown
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/multitool_drop.ogg
  - type: PhysicalComposition
    materialComposition:
      Steel: 200
      Plastic: 300
  - type: Damageable
    damageModifierSet: PlasteelMod
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 175
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
