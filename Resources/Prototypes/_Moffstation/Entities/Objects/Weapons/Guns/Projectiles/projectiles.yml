- type: entity
  parent: BulletKinetic
  id: BulletKineticSmall
  name: small kinetic bolt
  categories: [ HideSpawnMenu ]
  description: Not too bad, but you still don't want to get hit by it.
  components:
  - type: Projectile
    impactEffect: BulletImpactEffectKinetic
    damage:
      types:
        Blunt: 10
        Structural: 20

- type: entity
  abstract: true
  parent: ProjectilePolyboltBaseUpstream
  id: ProjectilePolyboltBase
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Moffstation/Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
    - shader: unshaded
      map: [ "enum.EffectLayers.Unshaded" ]
      state: blastwave
  - type: PointLight
    radius: 1.5
    energy: 3
    falloff: 6
  - type: RgbLightController
    cycleRate: 2
  - type: Projectile
    soundHit:
      collection: SpellShimmerImpact
    impactEffect: SpellImpactEffect
  - type: SpawnEntityTableOnTrigger
    table:
      id: MoffEffectRGBSparksSilent
      amount: !type:RangeNumberSelector
        range: 2, 5
