- type: entity
  parent: BulletKinetic
  id: BulletKineticSmall
  name: small kinetic bolt
  categories: [ HideSpawnMenu ]
  description: Not too bad, but you still don't want to get hit by it.
  components:
  - type: Projectile
    impactEffect: BulletImpactEffectKinetic
    damage:
      types:
        Blunt: 10
        Structural: 20

- type: entity
  parent: [SolutionAmmo, BaseBullet]
  id: MoffBloodBolt
  categories: [ HideSpawnMenu ]
  name: blood bolt
  description: This'll hurt.
  components:
  - type: Reflective
    reflective:
    - NonEnergy
  - type: Ammo
    muzzleFlash: null
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles2.rsi
    layers:
    - state: crossbowbolt
      shader: unshaded
  - type: Projectile
    damage:
      types:
        Piercing: 2
  - type: Solution
    solution:
      maxVol: 10
      reagents:
      - ReagentId: TearGas
        Quantity: 5
      - ReagentId: Hemorrhinol
        Quantity: 5
  - type: SolutionInjectOnProjectileHit
    transferAmount: 10
    solution: ammo
