- type: entity
  parent: ProjectilePolyboltCarp
  id: MoffProjectilePolyboltShark
  name: shark polybolt
  categories: [ HideSpawnMenu ]
  components:
  - type: PolymorphOnTrigger
    polymorph: MoffWizardForcedShark

- type: entity
  parent: ProjectilePolyboltCarp
  id: MoffProjectilePolyboltDragon
  name: shark polybolt
  categories: [ HideSpawnMenu ]
  components:
  - type: PolymorphOnTrigger
    polymorph: MoffWizardForcedDragon

- type: entity
  parent: GrapplingHook
  id: MoffDemonicChainHook
  name: demonic chain hook
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/throwing_knife.rsi
    layers:
    - state: icon
  - type: Ammo
    muzzleFlash: null
  - type: Projectile
    angle: 225
    deleteOnCollide: false
    penetrationThreshold: 1000
    damage:
      types:
        Piercing: 10
    soundHit:
      path: "/Audio/_Moffstation/Surgery/retractor2.ogg"
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.1,0,0.1" # Asymmetric - favors the pointy side
        mask:
        - Impassable
        - BulletImpassable
