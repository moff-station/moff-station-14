  - type: Sprite
    state: plasmarble
  - type: Item
    heldPrefix: plasmarble
  - type: FloorTile
    outputs:
    - Plating
    - MoffFloorPlasmaMarble
  - type: Stack
    stackType: MoffFloorTilePlasmaMarble
  - type: DamageOtherOnHit
    damage:
      types:
        Blunt: 6

- type: entity
