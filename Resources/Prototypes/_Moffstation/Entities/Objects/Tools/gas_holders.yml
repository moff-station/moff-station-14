- type: entity
  abstract: true
  id: GasCanVisualsBase
  components:
  - type: Appearance
  - type: GasCanVisuals
    visuals: Default
  - type: Sprite
    sprite: _Moffstation/Structures/Storage/gas_canister.rsi
    layers:
    - state: tank
      map: [ "enum.GasHolderVisualsLayers.Tank" ]
    - state: stripe-low
      map: [ "enum.GasHolderVisualsLayers.StripeLow" ]
    - state: stripe-middle
      map: [ "enum.GasHolderVisualsLayers.StripeMiddle" ]
    - state: hardware
    - state: paper
      visible: false
      map: [ "enum.PaperLabelVisuals.Layer" ]
      sprite: Structures/Storage/canister.rsi
    - state: integrity-unshaded-0
      map: [ "enum.MaxPressureVisualLayers.BaseUnshaded" ]
      shader: unshaded
      visible: false
      sprite: Structures/Storage/canister.rsi
    - state: mask-grey
      map: [ "enum.MaxPressureVisualLayers.Base" ]
      visible: false
      sprite: Structures/Storage/canister.rsi
    - state: can-open
      map: [ "tankInserted" ]
      visible: false
      sprite: Structures/Storage/canister.rsi
    - state: unlocked
      map: [ "locked" ]
      sprite: Structures/Storage/canister.rsi
    - state: can-o0
      map: [ "pressureLight" ]
      sprite: Structures/Storage/canister.rsi
    - state: can-connector
      map: [ "connectedToPort" ]
      visible: false
      sprite: Structures/Storage/canister.rsi
  - type: MaxPressureVisuals
    integrityMask: mask-grey
  - type: GenericVisualizer
    visuals:
      enum.AnchorVisuals.Anchored:
        connectedToPort:
          False: { state: can-connector, visible: false }
          True: { state: can-connector, visible: true }
      enum.GasCanisterVisuals.TankInserted:
        tankInserted:
          False: { state: can-open, visible: false }
          True: { state: can-open, visible: true }
      enum.LockVisuals.Locked:
        locked:
          False: { state: unlocked, shader: "unshaded" }
          True: { state: locked, shader: "unshaded" }
      enum.GasCanisterVisuals.PressureState:
        pressureLight:
          0: { state: can-o0, shader: "unshaded" }
          1: { state: can-o1, shader: "unshaded" }
          2: { state: can-o2, shader: "unshaded" }
          3: { state: can-o3, shader: "unshaded" }
      enum.PaperLabelVisuals.HasLabel:
        enum.PaperLabelVisuals.Layer:
          True: { visible: true }
          False: { visible: false }
      enum.StorageVisuals.Open:
        enum.PaperLabelVisuals.Layer:
          True: { visible: false }
      enum.PaperLabelVisuals.LabelType:
        enum.PaperLabelVisuals.Layer:
          Paper: { state: paper }
          Bounty: { state: bounty }
          CaptainsPaper: { state: captains_paper }
          Invoice: { state: invoice }

- type: entity
  abstract: true
  id: GasTankVisualsBase
  components:
  - type: Appearance
  - type: GasTankVisuals
    visuals: Default
    speciesWithDifferentClothing:
    - hamster
    - pig
    - possum
    - kangaroo
    - fox
    - dog
    - cat
    - sloth
    - puppy
  - type: Sprite
    sprite: _Moffstation/Objects/Tanks/tank.rsi
    layers:
    - state: icon-tank
      map: [ "enum.GasHolderVisualsLayers.Tank" ]
    - state: icon-stripe-low
      map: [ "enum.GasHolderVisualsLayers.StripeLow" ]
    - state: icon-stripe-middle
      map: [ "enum.GasHolderVisualsLayers.StripeMiddle" ]
    - state: icon-hardware
    - state: integrity-unshaded-0
      map: [ "enum.MaxPressureVisualLayers.BaseUnshaded" ]
      shader: unshaded
      visible: false
    - state: mask
      map: [ "enum.MaxPressureVisualLayers.Base" ]
      visible: false
  - type: Item
    sprite: _Moffstation/Objects/Tanks/tank.rsi
    inhandVisuals:
      Left:
      - state: inhand-left-hardware
      Right:
      - state: inhand-right-hardware
  - type: Clothing
    sprite: _Moffstation/Objects/Tanks/tank.rsi
    clothingVisuals:
      back:
      - state: equipped-BACKPACK-hardware
      # Standard tanks aren't equippable in the belt, but it's nicer to define this here and not use it than to have to
      # redefine all of these mappings to add just the belt visuals for smaller tanks.
      belt:
      - state: equipped-BELT-hardware
      suitstorage:
      - state: equipped-SUITSTORAGE-hardware
      suitstorage-hamster:
      - state: equipped-SUITSTORAGE-hardware-hamster
      suitstorage-pig:
      - state: equipped-SUITSTORAGE-hardware-pig
      suitstorage-possum:
      - state: equipped-SUITSTORAGE-hardware-possum
      suitstorage-kangaroo:
      - state: equipped-SUITSTORAGE-hardware-kangaroo
      suitstorage-fox:
      - state: equipped-SUITSTORAGE-hardware-fox
      suitstorage-dog:
      - state: equipped-SUITSTORAGE-hardware-dog
      suitstorage-cat:
      - state: equipped-SUITSTORAGE-hardware-cat
      suitstorage-sloth:
      - state: equipped-SUITSTORAGE-hardware-sloth
      suitstorage-puppy:
      - state: equipped-SUITSTORAGE-hardware-puppy
  - type: MaxPressureVisuals


- type: entity
  parent: GasTankRoundBase
  abstract: true
  id: EmergencyGasTankBase
  components:
  - type: Item
    size: Small
  - type: GasTank
    air:
      volume: 0.66
      temperature: 293.15
    overpressure: 1519.875 # Poorly manufactured, they also lose pressure quickly so this makes exploding them easier, at the cost of the explosion being smaller.
  - type: Clothing
    sprite: _Moffstation/Objects/Tanks/emergency.rsi
    slots:
    - Pocket
    - Belt
    - suitStorage
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 5
  - type: PhysicalComposition
    materialComposition:
      Steel: 100
  # Moffstation - Begin (Survival Box Improvements)
  - type: Tag
    tags:
    - SurvivalBoxInsertable
  # Moffstation - End

