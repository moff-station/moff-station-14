- type: entity
  parent: BaseSubdermalImplant
  id: FrenchImplant
  name: french implant
  description: Gives the user the ability to speak a perfect french accent
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
    implantComponents:
    - type: FrenchAccentToggle
  - type: Tag
    tags:
    - SubdermalImplant
    - HideContextMenu

- type: entity
  parent: BaseSubdermalImplant
  id: SmokeImplant
  name: smoke implant
  description: This implant releases a smoke cloud on activation.
  categories: [ HideSpawnMenu ]
  components:
    - type: SubdermalImplant
      implantAction: ActivateSmokeImplant
    - type: TriggerOnActivateImplant
    - type: SmokeOnTrigger
      spreadAmount: 50
      duration: 30
      targetUser: true
    - type: EmitSoundOnTrigger
      predicted: true
      sound: /Audio/Items/smoke_grenade_smoke.ogg
