# Random objective table for the nuke op leader (the commander). Picked from by the objective picker.
- type: weightedRandom
  id: NukeOpsLeaderObjectiveGroups
  weights:
    NukeOpsLeaderObjectiveGroupDefault: 1.0

- type: weightedRandom
  id: NukeOpsLeaderObjectiveGroupDefault
  weights:
    NukeOpsDestroyStationObjective: 1.0
    NukeOpsKidnapCommandObjective: 1.0
    NukeOpsKidnapPersonObjective: 1.0

- type: entity
  parent: BaseNukeOpsObjective
  id: NukeOpsKidnapPersonObjective
  description: The Syndicate wants a word with them. Take them off the station alive and bring them back with you.
  components:
  - type: Objective
    icon:
      sprite: Objects/Misc/handcuffs.rsi
      state: handcuff
  - type: SimpleObjective
    title: objective-nukeops-kidnap-command-title
  - type: MoffObjectivePack
    objectives: !type:NestedSelector
      tableId: NukeOpsKidnapPersonTable


- type: entityTable
  id: NukeOpsKidnapPersonTable
  table: !type:AllSelector # we need to pass a list of rules, since rules have further restrictions to consider via StationEventComp
    children:
      - id: NukeOpsKidnapPersonObjective
        amount: !type:RangeNumberSelector
          range: 4, 6

- type: entity
  abstract: true
  parent: BaseObjective
  id: BaseNukeOpsObjective
  components:
  - type: Objective
    difficulty: 1
    issuer: TheSyndicate
  - type: RoleRequirement
    roles:
    - NukeopsRole

- type: entity
  parent: BaseNukeOpsObjective
  id: NukeOpsDestroyStationObjective
  name: Destroy the station with a nuclear device.
  description: Arm the nuclear device and detonate it on the station. Leave nothing but a crater.
  components:
  - type: Objective
    icon:
      sprite: Objects/Devices/nuke.rsi
      state: nuclearbomb_base
  - type: SimpleObjective
    title: objective-nukeops-destroy-station-title

- type: entity
  parent: BaseNukeOpsObjective
  id: NukeOpsKidnapCommandObjective
  name: Kidnap a member of command.
  description: Capture a member of the station's command staff and bring them back to your shuttle alive.
  components:
  - type: Objective
    icon:
      sprite: Objects/Misc/id_cards.rsi
      state: icon-captain
  - type: SimpleObjective
    title: objective-nukeops-kidnap-command-title

- type: entity
  parent: BaseNukeOpsObjective
  id: NukeOpsKidnapPersonObjective
  description: The Syndicate wants a word with them. Take them off the station alive and bring them back with you.
  components:
  - type: Objective
    difficulty: 2
    icon:
      sprite: Objects/Misc/handcuffs.rsi
      state: handcuff
  - type: TargetObjective
    title: objective-nukeops-kidnap-person-title
  - type: PickRandomPerson
    conditions:
    # Don't send them after their own squad, or any other antag.
    - !type:AntagonistCondition
      inverted: true
  - type: CodeCondition
