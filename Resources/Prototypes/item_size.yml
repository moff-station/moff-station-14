# Items that can be held completely in one's hand.
- type: itemSize
  id: Tiny
  weight: 1
  stowDelay: 0.2 # Moff - Stow delay
  name: item-component-size-Tiny
  defaultShape:
  - 0,0,0,0

# Items that can fit inside of a standard pocket.
- type: itemSize
  id: Small
  weight: 2
  stowDelay: 0.4 # Moff - Stow delay
  name: item-component-size-Small
  defaultShape:
  - 0,0,0,1

# Items that can fit inside of a standard bag.
- type: itemSize
  id: Normal
  weight: 4
  stowDelay: 0.6 # Moff - Stow delay
  name: item-component-size-Normal
  defaultShape:
  - 0,0,1,1

# Items that are too large to fit inside of standard bags, but can worn in exterior slots or placed in custom containers.
- type: itemSize
  id: Large
  weight: 8
  stowDelay: 1.0 # Moff - Stow delay
  name: item-component-size-Large
  defaultShape:
  - 0,0,3,1

# Items that are too large to place inside of any kind of container.
- type: itemSize
  id: Huge
  weight: 16
  stowDelay: 2.0 # Moff - Stow delay
  name: item-component-size-Huge
  defaultShape:
  - 0,0,3,3

# Items that are so big they only fit in bluespace storages
- type: itemSize
  id: Ginormous
  weight: 32
  stowDelay: 3.0 # Moff - Stow delay
  name: item-component-size-Ginormous
  defaultShape:
  - 0,0,5,5

# Picture furry gf
- type: itemSize
  id: Colossal
  weight: 64
  stowDelay: 4.0 # Moff - Stow delay
  name: item-component-size-Colossal
  defaultShape:
  - 0,0,6,5
