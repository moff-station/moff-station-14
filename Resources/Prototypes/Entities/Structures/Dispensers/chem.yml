- type: entity
  id: ChemDispenserEmpty
  name: chemical dispenser
  suffix: Empty
  parent: ReagentDispenserBase
  description: An industrial grade chemical dispenser.
  components:
  - type: Sprite
    sprite: Structures/dispensers.rsi
    state: industrial-working
    snapCardinals: true
  - type: Storage
    openOnActivate: false
    whitelist:
      tags:
      - ChemDispensable
  - type: ApcPowerReceiver
  - type: ExtensionCableReceiver
  - type: Machine
    board: ChemDispenserMachineCircuitboard
  - type: GuideHelp
    guides:
    - Chemicals
    - Chemist
  - type: StealTarget
    stealGroup:
    - ChemDispenser
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25, -0.4, 0.25, 0.4"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: AmbientMusicMarkerMedical
  # Moff start - Add more multiples of 5u
  - type: ReagentDispenser
    dispenseAmounts: [ 1, 5, 10, 15, 20, 25, 30, 40, 50, 60, 100, 120 ]
  # Moff end

- type: entity
  id: ChemDispenser
  suffix: Filled
  parent: ChemDispenserEmpty
  components:
  - type: ReagentDispenser
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: JugAluminium
        - id: JugCarbon
        - id: JugChlorine
        - id: JugCopper
        - id: JugEthanol
        - id: JugFluorine
        - id: JugSugar
        - id: JugHydrogen
        - id: JugIodine
        - id: JugIron
        - id: JugLithium
        - id: JugMercury
        - id: JugNitrogen
        - id: JugOxygen
        - id: JugPhosphorus
        - id: JugPotassium
        - id: JugRadium
        - id: JugSilicon
        - id: JugSodium
        - id: JugSulfur
