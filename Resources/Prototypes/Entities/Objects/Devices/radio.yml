- type: entity
  parent: BaseItem
  id: RadioHandheld
  name: handheld radio
  description: A handy handheld radio.
  components:
#  Moffstation - Start - Give radio mic/speaker controls
  - type: TelecomExempt
  - type: RadioMicrophone
    unobstructedRequired: true
    listenRange: 2
    toggleOnInteract: false
  - type: RadioSpeaker
    toggleOnInteract: false
  - type: Speech
    speechVerb: Robotic
  - type: Sprite
    sprite: Objects/Devices/communication.rsi
    layers:
    - state: walkietalkie
    - map: [enum.RadioDeviceVisualLayers.Broadcasting]
      state: walkietalkie-on
      shader: unshaded
      visible: false
    - map: [enum.RadioDeviceVisualLayers.Speaker]
      state: walkietalkie-active
      shader: unshaded
      visible: false
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.RadioDeviceVisuals.Broadcasting:
        enum.RadioDeviceVisualLayers.Broadcasting:
          True: { visible: true }
          False: { visible: false }
      enum.RadioDeviceVisuals.Speaker:
        enum.RadioDeviceVisualLayers.Speaker:
          True: { visible: true }
          False: { visible: false }
  - type: Item
    sprite: Objects/Devices/communication.rsi
    heldPrefix: walkietalkie
  - type: Tag
    tags:
    - Radio
  - type: EncryptionKeyHolder
    keysUnlocked: False
    keySlots: 1
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeyHandheld
  - type: ContainerContainer
    containers:
      key_slots: !type:Container
  - type: Intercom
    requiresPower: false
  - type: ActivatableUI
    key: enum.IntercomUiKey.Key
    singleUser: true
  - type: UserInterface
    interfaces:
      enum.IntercomUiKey.Key:
        type: IntercomBoundUserInterface
# Moffstation - End

- type: entity
  parent: [ RadioHandheld, BaseSecurityContraband ]
  id: RadioHandheldSecurity
  name: security radio
  description: A handy security radio.
  components:
# Moffstation - Start - Update for speaker functionality
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeySecurity
# Moffstation - End
  - type: Sprite
    sprite: Objects/Devices/securityhandy.rsi
  - type: Item
    sprite: Objects/Devices/securityhandy.rsi
