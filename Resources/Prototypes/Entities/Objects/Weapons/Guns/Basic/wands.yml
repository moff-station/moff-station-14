- type: entity
  name: wand of fireball
  parent: WeaponWandBase
  id: WeaponWandFireball
  description: Great big balls of fire!
  components:
  - type: Sprite
    layers:
    - state: fire
    - state: fire-effect
      map: ["effect"]
  - type: Gun
    fireRate: 0.25
    soundGunshot:
      path: /Audio/Magic/fireball.ogg
    projectileSpeed: 25
  - type: BasicEntityAmmoProvider
    # Moff Start - Entity table integration
    # proto: ProjectileFireball
    ammoTable:
      id: ProjectileFireball
    # Moff End
    capacity: 5
    count: 5

- type: entity
  name: wand of the locker
  description: Stuff nerds at a distance!
  parent: WeaponWandBase
  id: WeaponWandLocker
  components:
  - type: Sprite
    layers:
    - state: locker
      map: ["base"]
    - state: locker-effect
      map: ["effect"]
  - type: Gun
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/Magic/staff_animation.ogg
    projectileSpeed: 25
  - type: BasicEntityAmmoProvider
    # Moff Start - Entity table integration
    # proto: ProjectileLocker
    ammoTable:
      id: ProjectileLocker
    # Moff End
    capacity: 5
    count: 5
  - type: Item
    size: Normal
    inhandVisuals:
      left:
      - state: locker-inhand-left
      right:
      - state: locker-inhand-right
  - type: GenericVisualizer
    visuals:
      enum.AmmoVisuals.HasAmmo:
        effect:
          True: { visible: False }
          False: { visible: True }
        base:
          True: { visible: True }
          False: { visible: False }

- type: entity
  name: magical wand of instant death
  parent: WeaponWandBase
  id: WeaponWandDeath
  description: Only the best and brightest of the Space Wizards R&D team worked together to create this beauty.
  components:
  - type: Sprite
    layers:
    - state: death
    - state: death-effect
      map: ["effect"]
  - type: Gun
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/mateba.ogg # PUNCH
    projectileSpeed: 25
  - type: BasicEntityAmmoProvider
    # Moff Start - Entity table integration
    # proto: BulletInstakillMagic
    ammoTable:
      id: BulletInstakillMagic
    # Moff End
    capacity: 3
    count: 3

