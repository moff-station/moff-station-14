- type: entity
  parent: WeaponWandBase
  id: WeaponWandPolymorphBase
  abstract: true
  components:
  - type: Sprite
    layers:
    - state: poly
    - state: poly-effect
      map: ["effect"]
  - type: Gun
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/Magic/staff_animation.ogg
    projectileSpeed: 25
  - type: BasicEntityAmmoProvider
    # Moff Start - Entity table integration
    # proto: ProjectilePolyboltCarp
    ammoTable:
      id: ProjectilePolyboltCarp
    # Moff End
    capacity: 5

- type: entity
  name: wand of carp polymorph
  parent: WeaponWandPolymorphBase
  id: WeaponWandPolymorphCarp
  description: For when you need a carp filet quick and the clown is looking juicy.
  components:
  - type: BasicEntityAmmoProvider
    # Moff Start - Entity table integration
    # proto: ProjectilePolyboltCarp
    ammoTable: !type:GroupSelector
      children:
      - id: ProjectilePolyboltCarp
        weight: 15 # D20 Roll of 1-15
      - id: MoffProjectilePolyboltShark
        weight: 4 # D20 Roll of 16-19
      - id: MoffProjectilePolyboltDragon
        weight: 1 # D20 Roll of 20, Critical!
    # Moff End
    capacity: 5
    count: 5

