- type: entity
  abstract: true
  parent: ClothingNeckMetallicChameleonableBase # Moffstation - Fix neck slot parenting
  id: ClothingNeckMedalBase
  name: medal
  description: A medal to show your mettle. May or may not be made of metal.
  components:
  - type: Tag
    tags:
      - Medal
      - MonkeyWearable
      - WhitelistChameleon
- type: entity
  parent: ClothingNeckMedalBase
  id: ClothingNeckBronzeheart
  name: bronzeheart medal
  description: Given to crewmates for exemplary bravery in the face of danger.
  components:
  - type: Sprite
    sprite: Clothing/Neck/Medals/bronzeheart.rsi
  - type: Clothing
    sprite: Clothing/Neck/Medals/bronzeheart.rsi
  # Moffstation - Start - Examinable Clothing & Medal rewards
  - type: ExtraExaminable
    wornText: clothing-medal-bronzeheart
  - type: CrewMedal
  - type: ActivatableUI
    key: enum.CrewMedalUiKey.Key
    inHandsOnly: true
  - type: UserInterface
    interfaces:
      enum.CrewMedalUiKey.Key:
        type: CrewMedalBoundUserInterface
  # Moffstation - End

- type: entity
