- type: entity
  parent: [ClothingUniformBase, ClothingUniformFoldableBase]
  id: ClothingUniformJumpsuitCargo
  name: cargo tech jumpsuit
  description: A sturdy jumpsuit, issued to members of the Cargo department.
  components:
  # Moff Start - Cargo Outfits
  - type: Sprite
    sprite: _Moffstation/Clothing/Uniforms/Jumpsuit/cargo.rsi
  - type: Clothing
    sprite: _Moffstation/Clothing/Uniforms/Jumpsuit/cargo.rsi
  # Moff End

- type: entity
  parent: [ClothingUniformBase, ClothingUniformFoldableBase]
  id: ClothingUniformJumpsuitSalvageSpecialist
  name: salvage specialist's jumpsuit
  description: It's a snappy jumpsuit with a sturdy set of overalls. It's very dirty.
  components:
  # Moffstation - Start
  - type: Sprite
    sprite: _Moffstation/Clothing/Uniforms/Jumpsuit/jumpsuit.rsi
    layers:
    - state: icon
      color: &color-maroon "#b2435a"
    - state: basics-trinkets-icon
    - state: overalls-trinkets-icon
      color: &color-lightbrown "#9b5244"
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
        color: *color-maroon
      right:
      - state: inhand-right
        color: *color-maroon
  - type: Clothing
    sprite: _Moffstation/Clothing/Uniforms/Jumpsuit/jumpsuit.rsi
    clothingVisuals:
      jumpsuit:
      - state: equipped-INNERCLOTHING
        color: *color-maroon
      - state: basics-trinkets-equipped-INNERCLOTHING
      - state: overalls-trinkets-equipped-INNERCLOTHING
        color: *color-lightbrown
# Moffstation - End

