  description: It's a turtleneck worn by those with the know-how to achieve the position of Research Director. Its fabric provides minor protection from biological contaminants.
  components:
  - type: Sprite
    sprite: _Moffstation/Clothing/Uniforms/Jumpsuit/rnd.rsi # Moffstation
  - type: Clothing
    sprite: _Moffstation/Clothing/Uniforms/Jumpsuit/rnd.rsi # Moffstation

- type: entity
  parent: ClothingUniformBase #Moffstation - Remove folding
  id: ClothingUniformJumpsuitScientist
  name: scientist jumpsuit
  description: It's made of a special fiber that increases perceived intelligence and decreases personal ethics. It has markings that denote the wearer as a scientist.
  components:
  # Moffstation - Start
  - type: Sprite
    sprite: _Moffstation/Clothing/Uniforms/Jumpsuit/jumpsuit.rsi
    layers:
    - state: icon-light
    - state: professional-trinkets-icon
    - state: color-trinkets-icon
      color: "#b20dff"
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
        color: "#b20dff"
      right:
      - state: inhand-right
        color: "#b20dff"
  - type: Clothing
    sprite: _Moffstation/Clothing/Uniforms/Jumpsuit/scrubs.rsi
    clothingVisuals:
      jumpsuit:
      - state: equipped-INNERCLOTHING-light
      - state: professional-trinkets-equipped-INNERCLOTHING
      - state: color-trinkets-equipped-INNERCLOTHING
        color: "#b20dff"
  # Moffstation - End

