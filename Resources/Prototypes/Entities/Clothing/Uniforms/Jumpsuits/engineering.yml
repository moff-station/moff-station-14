- type: entity
  parent: [ClothingUniformBase, BaseCommandContraband, ClothingUniformFoldableBase]
  id: ClothingUniformJumpsuitChiefEngineer
  name: chief engineer's jumpsuit
  description: It's a high visibility jumpsuit given to those engineers insane enough to achieve the rank of Chief Engineer.
  components:
  - type: Sprite
    sprite: _Moffstation/Clothing/Uniforms/Jumpsuit/ce.rsi # Moffstation - Begin - Engineering Outfit Resprites

- type: entity
  parent: [ClothingUniformBase, BaseCommandContraband]
  id: ClothingUniformJumpsuitChiefEngineerTurtle
  name: chief engineer's turtleneck
  description: A yellow turtleneck designed specifically for work in conditions of the engineering department.
  components:
  - type: Sprite
    sprite: _Moffstation/Clothing/Uniforms/Jumpsuit/ce_turtle.rsi # Moffstation - Begin - Engineering Outfit Resprites
  - type: Clothing
    sprite: _Moffstation/Clothing/Uniforms/Jumpsuit/ce_turtle.rsi # Moffstation - Begin - Engineering Outfit Resprites

- type: entity
  parent: [ClothingUniformBase, ClothingUniformFoldableBase]
  id: ClothingUniformJumpsuitEngineering
  name: engineering jumpsuit
  description: If this suit was non-conductive, maybe engineers would actually do their damn job.
  components:
  - type: Sprite
    # Moffstation - Start - Engineering outfit resprites
    sprite: _Moffstation/Clothing/Uniforms/Jumpsuit/jumpsuit.rsi
    layers:
    - state: icon
      color: &color-orange "#db542e"
    - state: basics-trinkets-icon
    - state: color-trinkets-icon
      color: &color-darkblue "#547abb"
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
        color: *color-orange
      right:
      - state: inhand-right
        color: *color-orange
  - type: Clothing
    sprite: _Moffstation/Clothing/Uniforms/Jumpsuit/jumpsuit.rsi
    clothingVisuals:
      jumpsuit:
      - state: equipped-INNERCLOTHING
        color: *color-orange
      - state: basics-trinkets-equipped-INNERCLOTHING
      - state: color-trinkets-equipped-INNERCLOTHING
        color: *color-darkblue
    # Moffstation - End

- type: entity
  parent: [ClothingUniformBase, ClothingUniformFoldableBase]
  id: ClothingUniformJumpsuitEngineeringHazard
