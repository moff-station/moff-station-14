- type: entity
  parent: ClothingUniformSkirtBase
  id: ClothingUniformJumpskirtEngineering
  name: engineering jumpskirt
  description: If this suit was non-conductive, maybe engineers would actually do their damn job.
  components:
  # Moffstation - Start
  - type: Sprite
    sprite: _Moffstation/Clothing/Uniforms/Jumpskirt/jumpskirt.rsi
    layers:
    - state: icon
      color: "#db542e"
    - state: basics-trinkets-icon
    - state: color-trinkets-icon
      color: "#547abb"
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
        color: "#db542e"
      right:
      - state: inhand-right
        color: "#db542e"
  - type: Clothing
    sprite: _Moffstation/Clothing/Uniforms/Jumpskirt/jumpskirt.rsi
    clothingVisuals:
      jumpsuit:
      - state: equipped-INNERCLOTHING
        color: "#db542e"
      - state: basics-trinkets-equipped-INNERCLOTHING
      - state: color-trinkets-equipped-INNERCLOTHING
        color: "#547abb"
# Moffstation - End

