  description: It's made of a special fiber that increases perceived intelligence and decreases personal ethics. It has markings that denote the wearer as a scientist.
  components:
  # Moffstation - Start
  - type: Sprite
    sprite: _Moffstation/Clothing/Uniforms/Jumpskirt/jumpskirt.rsi
    layers:
    - state: icon
    - state: professional-trinkets-icon
    - state: color-trinkets-icon
      color: "#ac50e6"
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
  - type: Clothing
    sprite: _Moffstation/Clothing/Uniforms/Jumpskirt/jumpskirt.rsi
    clothingVisuals:
      jumpsuit:
      - state: equipped-INNERCLOTHING
      - state: professional-trinkets-equipped-INNERCLOTHING
      - state: color-trinkets-equipped-INNERCLOTHING
        color: "#ac50e6"
# Moffstation - End

