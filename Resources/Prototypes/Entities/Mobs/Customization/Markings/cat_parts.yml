- type: marking
  id: CatEars
  # Moffstation - Begin (Increase Markings)
  bodyPart: HeadTop
  groupWhitelist: [Human, Dwarf]
  # Moffstation - End
  coloring:
    default:
      type: !type:CategoryColoring
        category: Hair
      fallbackTypes:
      - !type:SkinColoring {}
  sprites:
  - sprite: Mobs/Customization/cat_parts.rsi
    state: ears_cat_outer
  - sprite: Mobs/Customization/cat_parts.rsi
    state: ears_cat_inner
    coloring:
      type: !type:SimpleColoring
        color: '#FFFFFF'

- type: marking
  id: CatTail
  bodyPart: Tail
  groupWhitelist: [Human, Dwarf] # Moffstation - (Increase Markings)
  coloring:
    default:
      type: !type:CategoryColoring
        category: Hair
      fallbackTypes:
      - !type:CategoryColoring
        category: FacialHair
      - !type:SkinColoring {}
  sprites:
  - sprite: Mobs/Customization/cat_parts.rsi
    state: tail_cat
