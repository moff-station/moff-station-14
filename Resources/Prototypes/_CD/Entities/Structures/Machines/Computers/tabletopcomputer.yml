# Base Computer, Mostly Used As Parent
- type: entity
  id: BaseStructureComputerTabletop
  suffix: Tabletop
  abstract: true
  components:
  - type: Sprite
    sprite: _Moffstation/Structures/Machines/computers.rsi # Moffstation
    drawdepth: SmallObjects
    layers:
    - map: ["enum.ComputerVisualLayers.Frame"]
      sprite: _Moffstation/Structures/Machines/computers.rsi # Moffstation
      state: computer_tabletop
      offset: 0.043, 0.055
    - map: ["enum.ComputerVisualLayers.Keyboard"]
      sprite: _Moffstation/Structures/Machines/computers.rsi # Moffstation
      state: generic_keyboard_tabletop
      offset: 0.043, 0.055
    - map: ["enum.ComputerVisualLayers.Screen"]
      sprite: _Moffstation/Structures/Machines/computers.rsi # Moffstation
      state: generic
      offset: 0.043, 0.055
    - map: ["enum.ComputerVisualLayers.Keys"]
      sprite: _Moffstation/Structures/Machines/computers.rsi # Moffstation
      state: generic_keys
      offset: 0.043, 0.055
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 60
        mask:
        - Impassable
        - LowImpassable
#        - TabletopMachineMask
#        layer:
#        - TabletopMachineLayer

#Base Computers
#Medical Records
- type: entity
  parent: [BaseStructureComputerTabletop, ComputerMedicalRecords]
  id: ComputerTabletopMedicalRecords
  components:
  - type: ComputerVisuals
    stateFrame: computer_tabletop
    stateKeyboard: generic_keyboard_tabletop
    stateScreen: medcomp
    stateKeys: med_key
    statePanel: null # Moff - tabletop computers have no maintenance panel layer

