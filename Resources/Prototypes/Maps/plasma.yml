            Captain: [ 1, 1 ]
            HeadOfPersonnel: [ 1, 1 ]
            HeadOfSecurity: [ 1, 1 ]
            ChiefMedicalOfficer: [ 1, 1 ]
            ChiefEngineer: [ 1, 1 ]
            ResearchDirector: [ 1, 1 ]
            Quartermaster: [ 1, 1 ]
            #service 7-11
            Bartender: [ 1, 1 ]
            Botanist: [ 2, 2 ]
            Chef: [ 1, 1 ]
            Janitor: [ 1, 2 ]
            Chaplain: [ 1, 1 ]
            Librarian: [ 1, 1 ] # Moff - Keep RP roles roundstart
            Reporter: [ 1, 1 ] # Moff - Keep RP roles roundstart
            ServiceWorker: [ 1, 2 ]
            #engineering 7-8
            AtmosphericTechnician: [ 2, 2 ]
            StationEngineer: [ 3, 4 ]
#            TechnicalAssistant: [ 2, 2 ] # Moffstation - Removed role
            #medical 7-9
            Chemist: [ 2, 2 ]
            MedicalDoctor: [ 2, 3 ]
            MedicalIntern: [ 2, 2 ]
